<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Nebula Touch</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05050a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nebula Touch">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #05050a;
    --panel: rgba(12, 12, 20, 0.72);
    --panel-border: rgba(255, 255, 255, 0.08);
    --ink: #eef0f6;
    --ink-dim: #8a8ea3;
    --accent: #7df9ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    touch-action: none;
    overscroll-behavior: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: block;
  }

  /* Title flash on load */
  #title-card {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none;
    z-index: 5;
    animation: fadeOut 2.2s ease forwards;
  }
  #title-card h1 {
    font-weight: 200;
    letter-spacing: 0.4em;
    margin: 0;
    color: #fff;
    text-shadow: 0 0 40px rgba(125, 249, 255, 0.6);
    font-size: clamp(32px, 10vw, 56px);
  }
  #title-card p {
    margin-top: 10px;
    letter-spacing: 0.3em;
    font-size: 11px;
    color: var(--ink-dim);
    text-transform: uppercase;
  }
  @keyframes fadeOut {
    0% { opacity: 1; }
    55% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Top status bar */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: max(14px, env(safe-area-inset-top)) 18px 10px;
    z-index: 3;
    pointer-events: none;
  }
  #topbar .brand {
    font-size: 12px;
    letter-spacing: 0.28em;
    color: var(--ink-dim);
    text-transform: uppercase;
  }
  #fps {
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.1em;
    font-variant-numeric: tabular-nums;
  }

  /* Bottom control dock */
  #dock {
    position: fixed; left: 0; right: 0; bottom: 0;
    z-index: 4;
    padding: 0 14px max(14px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 10px;
    background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0));
    transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.32s ease;
    max-height: 82vh;
  }
  #dock.hidden {
    transform: translateY(115%);
    opacity: 0;
    pointer-events: none;
  }

  #dockHandle {
    align-self: center;
    width: 44px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-dim);
    font-size: 14px;
    cursor: pointer;
  }

  #showDockBtn {
    position: fixed;
    left: 50%; bottom: max(12px, env(safe-area-inset-bottom));
    transform: translateX(-50%) scale(0.85);
    z-index: 6;
    width: 44px; height: 30px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: var(--ink-dim);
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease, transform 0.28s ease;
  }
  #showDockBtn.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) scale(1);
  }

  .mode-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .mode-row::-webkit-scrollbar { display: none; }

  .chip {
    flex: 0 0 auto;
    padding: 9px 16px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: var(--ink-dim);
    font-size: 13px;
    letter-spacing: 0.02em;
    white-space: nowrap;
    transition: color 0.2s, border-color 0.2s, background 0.2s;
  }
  .chip.active {
    color: #05050a;
    background: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }

  #panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding: 14px 16px 16px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    max-height: calc(82vh - 50px); /* leaves room for the mode row + handle above it */
    overscroll-behavior: contain;
  }

  .panel-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  .panel-head .label {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-dim);
  }
  #clearBtn {
    background: none; border: none; color: var(--ink-dim);
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 4px 0;
  }
  #fpsCapBtn, #reactiveBtn {
    background: none; border: 1px solid rgba(255,255,255,0.25); border-radius: 999px;
    color: var(--ink-dim); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 4px 10px; margin-left: 10px;
  }
  #fpsCapBtn.active, #reactiveBtn.active { color: var(--ink); border-color: var(--accent); background: rgba(125,249,255,0.12); }
  #reactiveBtn:disabled { opacity: 0.45; }

  .playlist-item {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; padding: 6px 8px; font-size: 12px; color: var(--ink-dim);
  }
  .playlist-item.active { border-color: rgba(255,255,255,0.6); color: var(--ink); }
  .playlist-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .playlist-item button {
    background: none; border: none; color: inherit; font-size: 13px; padding: 2px 4px; opacity: 0.7;
  }
  .playlist-item button:hover { opacity: 1; }

  .palette-row { display: flex; gap: 10px; margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .palette-row::-webkit-scrollbar { display: none; }
  .swatch {
    flex: 0 0 84px;
    height: 40px;
    border-radius: 12px;
    border: 1.5px solid transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: rgba(255,255,255,0.85);
    position: relative;
    overflow: hidden;
  }
  .swatch.active { border-color: rgba(255,255,255,0.9); }
  .swatch span { position: relative; z-index: 1; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
  .swatch.add {
    background: rgba(255,255,255,0.04) !important;
    border: 1.5px dashed rgba(255,255,255,0.35);
    color: var(--ink-dim);
  }
  .swatch .del {
    position: absolute; top: 3px; right: 4px; z-index: 2;
    width: 16px; height: 16px; line-height: 14px; padding: 0;
    border: none; border-radius: 50%;
    background: rgba(0,0,0,0.5); color: #fff; font-size: 10px;
  }

  .slider-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
  .slider-row { display: flex; justify-content: space-between; align-items: center; }
  .slider-row .label { font-size: 12px; color: var(--ink-dim); letter-spacing: 0.02em; text-transform: none; }
  .slider-row .value { font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums; }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.14);
    margin: 6px 0 14px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px rgba(125, 249, 255, 0.7);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 20px; height: 20px; border: none; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px rgba(125, 249, 255, 0.7);
  }

  #hint {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: rgba(255,255,255,0.35);
    font-size: 13px;
    letter-spacing: 0.08em;
    pointer-events: none;
    z-index: 2;
    animation: hintPulse 3s ease-in-out infinite;
  }
  @keyframes hintPulse {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 0.55; }
  }
  #hint.hidden { display: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<canvas id="stage"></canvas>

<div id="title-card">
  <h1>NEBULA</h1>
  <p>a living field</p>
</div>

<div id="topbar">
  <div class="brand">Nebula Touch</div>
  <div id="fps"></div>
</div>

<div id="hint">drag to stir the field</div>

<div id="dock">
  <div id="dockHandle">⌄</div>
  <div class="mode-row" id="modeRow"></div>
  <div id="panel">
    <div class="panel-head">
      <div class="label">Palette</div>
      <div style="display:flex; align-items:center;">
        <button id="fpsCapBtn">60fps cap: off</button>
        <button id="clearBtn" style="margin-left:10px;">Scatter</button>
      </div>
    </div>
    <div class="palette-row" id="paletteRow"></div>
    <div id="customPaletteCreator" style="display:none; gap:8px; align-items:center; flex-wrap:wrap;
         margin:-6px 0 14px; padding:10px; background:rgba(255,255,255,0.04);
         border:1px solid rgba(255,255,255,0.1); border-radius:12px;">
      <input type="color" id="customC1" value="#7df9ff" title="Color 1" style="width:32px;height:32px;border:none;background:none;padding:0;">
      <input type="color" id="customC2" value="#ff5fd8" title="Color 2" style="width:32px;height:32px;border:none;background:none;padding:0;">
      <input type="color" id="customC3" value="#8b5cff" title="Color 3" style="width:32px;height:32px;border:none;background:none;padding:0;">
      <input type="color" id="customC4" value="#5fffb0" title="Color 4" style="width:32px;height:32px;border:none;background:none;padding:0;">
      <input type="color" id="customBg" value="#05050a" title="Background" style="width:32px;height:32px;border:none;background:none;padding:0;">
      <input type="text" id="customName" placeholder="Name" maxlength="16"
        style="flex:1; min-width:70px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.15);
               border-radius:8px; color:var(--ink); font-size:12px; padding:6px 10px;">
      <button id="saveCustomPaletteBtn">Save</button>
      <button id="cancelCustomPaletteBtn">✕</button>
    </div>

    <div class="slider-group">
      <div class="slider-row"><span class="label">Particles</span><span class="value" id="densityVal">250</span></div>
      <input type="range" id="densitySlider" min="100" max="50000" value="250">
      <div class="slider-row"><span class="label">Trail</span><span class="value" id="trailVal">45</span></div>
      <input type="range" id="trailSlider" min="0" max="95" value="45">
      <div class="slider-row"><span class="label">Size</span><span class="value" id="sizeVal">100</span></div>
      <input type="range" id="sizeSlider" min="40" max="220" value="100">
      <div class="slider-row"><span class="label">Friction</span><span class="value" id="frictionVal">34</span></div>
      <input type="range" id="frictionSlider" min="0" max="100" value="34">
      <div class="slider-row"><span class="label">Speed</span><span class="value" id="speedVal">100</span></div>
      <input type="range" id="speedSlider" min="10" max="300" value="100">
    </div>

    <div class="panel-head" style="margin-top:14px;">
      <div class="label">Soundtrack</div>
      <div id="soundStatus" style="font-size:11px; color:var(--ink-dim);">no track loaded</div>
    </div>
    <div style="display:flex; gap:8px; margin-bottom:8px;">
      <button id="loadFileBtn" style="flex:1;">Choose file</button>
      <button id="playBtn" style="flex:1;" disabled>▶ Play</button>
      <button id="reactiveBtn" style="flex:1;" disabled>✦ React: off</button>
    </div>
    <div style="display:flex; gap:8px; margin-bottom:8px;">
      <input type="text" id="trackUrlInput" placeholder="Paste GitHub raw audio URL…"
        value="https://github.com/MyMan577/Game-audio/blob/main/Living%20Dreams.mp3"
        style="flex:1; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.15);
               border-radius:8px; color:var(--ink); font-size:12px; padding:6px 10px;">
      <button id="loadUrlBtn">Load</button>
    </div>
    <input type="file" id="audioFileInput" accept="audio/*,video/mp4,.mp4,.m4a" style="display:none;">
    <div class="slider-row"><span class="label">Volume</span><span class="value" id="volumeVal">70</span></div>
    <input type="range" id="volumeSlider" min="0" max="100" value="70">
    <div id="playlist" style="display:flex; flex-direction:column; gap:6px; margin-top:10px;"></div>
  </div>
</div>

<button id="showDockBtn" aria-label="Show controls">⌃</button>

<script type="module">
import * as THREE from 'three';
(function () {
  const canvas = document.getElementById('stage');
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, alpha: false, antialias: false, powerPreference: 'high-performance' });
  } catch (err) {
    renderer = null;
  }
  if (!renderer) {
    document.body.innerHTML = '<div style="color:#eee;font-family:sans-serif;padding:40px;">WebGL is not available in this browser.</div>';
    return;
  }
  renderer.autoClear = false; // every target is either fully repainted by the fade quad or explicitly .clear()'d — see resize()/palette switch
  let W, H, DPR;

  // ---------- Scene / camera ----------
  // Particles live in a real 3D volume: worldX/worldY mirror the old pixel
  // grid (so all the touch-interaction math below is completely untouched),
  // worldZ is a per-particle depth that gives the field actual thickness.
  // The camera sits fixed, dead-on-center — depth still reads through
  // per-particle size falloff (closer particles render bigger), which is
  // what sells Sphere mode's rotation without any camera motion at all.
  const particleScene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, 1, 10, 10000);
  let DEPTH = 400; // half-thickness of the particle volume, recomputed in resize()

  function updateCamera() {
    // Sphere is the only mode with real rotating 3D depth, so it alone
    // needs the extra orbitRadius margin to stay framed through a full
    // spin. Every other mode sits its particles flat at z=0, so the
    // camera sits at the exact fit distance — using orbitRadius for them
    // left a ~20% gap on every side (letterboxing).
    const dist = (mode === 'Sphere' ? camera.userData.orbitRadius : camera.userData.flatRadius) || 800;
    // Point-size falloff is normalized against this same distance so a
    // particle sitting at world z=0 always renders at its calibrated
    // pixel size — since dist differs by mode, the uniform has to track
    // it here every frame rather than being fixed once in resize().
    if (particleMaterial) particleMaterial.uniforms.uSizeScale.value = dist;
    camera.position.set(0, 0, dist);
    camera.lookAt(0, 0, 0);
  }

  // Touches are still expressed in the same 2D "simulation space" every
  // force function below already works in — we convert a screen point into
  // that space by raycasting onto the world's z=0 plane instead of using
  // clientX/clientY directly, because the camera's distance from that
  // plane varies by mode (Sphere's wider orbitRadius vs. the exact-fit
  // flatRadius elsewhere), which changes how screen coordinates map onto it.
  const raycaster = new THREE.Raycaster();
  const _ndc = new THREE.Vector2();
  const _groundPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
  const _hitPoint = new THREE.Vector3();
  function screenToSim(clientX, clientY) {
    _ndc.x = (clientX / W) * 2 - 1;
    _ndc.y = -(clientY / H) * 2 + 1;
    raycaster.setFromCamera(_ndc, camera);
    if (!raycaster.ray.intersectPlane(_groundPlane, _hitPoint)) return null;
    const simX = _hitPoint.x + W / 2;
    const simY = H / 2 - _hitPoint.y;
    const MAXR = Math.max(W, H) * 4;
    if (Math.abs(simX - W / 2) > MAXR || Math.abs(simY - H / 2) > MAXR) return null;
    return { x: simX, y: simY };
  }

  // ---------- GPU trail render targets (ping-pong) ----------
  // Canvas2D got trails "for free" by repainting the background at partial
  // alpha instead of clearing. Here we get the same effect by rendering
  // particles into an offscreen texture, then each frame drawing the
  // PREVIOUS frame's texture back into the new one at slightly reduced
  // alpha (a fullscreen quad, one draw call) before drawing this frame's
  // particles on top. Two targets so we're never reading and writing the
  // same texture at once.
  let fbos = [];
  function makeFBO(w, h) {
    return new THREE.WebGLRenderTarget(w, h, {
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      wrapS: THREE.ClampToEdgeWrapping,
      wrapT: THREE.ClampToEdgeWrapping,
      format: THREE.RGBAFormat,
      depthBuffer: false,
      stencilBuffer: false
    });
  }
  function destroyFBOs() {
    fbos.forEach(f => f.dispose());
    fbos = [];
  }
  let pingpong = 0;

  // ---------- Palettes ----------
  // (moved up from below — resize() needs these to clear the trail buffers
  // to the right background color, so they must exist before resize() runs)
  const PALETTES = {
    neon:    { name: 'Neon',    bg: '#05050a', colors: ['#7df9ff', '#ff5fd8', '#8b5cff', '#5fffb0'] },
    crystal: { name: 'Crystal', bg: '#04060c', colors: ['#bfe9ff', '#8fd3ff', '#ffffff', '#6fb8ff'] },
    nature:  { name: 'Nature',  bg: '#050a06', colors: ['#8dffb0', '#ffe27a', '#6fff8f', '#c8ff6f'] },
    ember:   { name: 'Ember',   bg: '#0a0503', colors: ['#ff9d5c', '#ff5c5c', '#ffd15c', '#ff7ab0'] }
  };
  let paletteKey = 'neon';

  // ---------- Custom palettes ----------
  // User-created palettes get merged straight into PALETTES under a
  // generated key, so every existing paletteKey-based lookup (trail bg,
  // particle color picks, swatch rendering, save/restore) keeps working
  // completely unchanged — they're just more entries in the same object.
  const CUSTOM_PALETTES_KEY = 'nebulaCustomPalettes';
  function loadCustomPalettes() {
    try { return JSON.parse(localStorage.getItem(CUSTOM_PALETTES_KEY)) || {}; }
    catch { return {}; }
  }
  function saveCustomPalettes(obj) {
    localStorage.setItem(CUSTOM_PALETTES_KEY, JSON.stringify(obj));
  }
  const customPalettes = loadCustomPalettes();
  Object.keys(customPalettes).forEach((key) => { PALETTES[key] = customPalettes[key]; });

  function hexToRgbFloat(hex) {
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
    return [
      parseInt(hex.slice(0, 2), 16) / 255,
      parseInt(hex.slice(2, 4), 16) / 255,
      parseInt(hex.slice(4, 6), 16) / 255
    ];
  }

  function clearTargetToColor(rt, hexColor) {
    const c = hexToRgbFloat(hexColor);
    renderer.setRenderTarget(rt);
    renderer.setClearColor(new THREE.Color(c[0], c[1], c[2]), 1);
    renderer.clear(true, false, false);
    renderer.setRenderTarget(null);
  }

  // Shape radius is capped to whatever fits inside the screen with margin,
  // recomputed on resize — since the shape is locked to screen center and
  // can rotate to any angle, this is what keeps it from ever poking past
  // the edges no matter which way it's turned.
  let SPHERE_RADIUS = 130;
  function updateSphereRadius() {
    SPHERE_RADIUS = Math.max(40, Math.min(W, H) * 0.5 - 40);
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    DEPTH = Math.min(W, H) * 0.5;
    updateSphereRadius();

    renderer.setPixelRatio(DPR);
    renderer.setSize(W, H, true);

    camera.aspect = W / H;
    const fovRad = THREE.MathUtils.degToRad(camera.fov);
    // exact edge-to-edge distance for the field to fill the screen when the
    // camera is dead-on. camera.fov is the VERTICAL field of view, so this
    // has to be measured against H specifically (not max(W,H)) — aspect
    // then carries the correct horizontal extent automatically. Using
    // max(W,H) here used to stretch the world<->screen mapping unevenly in
    // landscape, which is what threw off touch position (and therefore
    // burst/release distances) in flat mode.
    const exactFitDist = (H / 2) / Math.tan(fovRad / 2);
    camera.userData.flatRadius = exactFitDist;
    // 3D auto/drag get a generous margin on top of that so the field stays
    // comfortably framed through the whole azimuth sweep / free-look drag,
    // not just when facing the camera dead-on
    camera.userData.orbitRadius = exactFitDist * 1.25;
    camera.near = 10;
    camera.far = camera.userData.orbitRadius * 4 + DEPTH * 4;
    camera.updateProjectionMatrix();
    // fallback for the very first paint before updateCamera has run once —
    // updateCamera overwrites this every frame with whatever distance the
    // active mode actually uses (flatRadius for everything except Sphere)
    if (particleMaterial) particleMaterial.uniforms.uSizeScale.value = camera.userData.orbitRadius;

    destroyFBOs();
    const bw = Math.max(1, Math.round(W * DPR)), bh = Math.max(1, Math.round(H * DPR));
    fbos = [makeFBO(bw, bh), makeFBO(bw, bh)];
    // clear both to the current palette background so a resize doesn't flash black
    clearTargetToColor(fbos[0], PALETTES[paletteKey].bg);
    clearTargetToColor(fbos[1], PALETTES[paletteKey].bg);
  }
  window.addEventListener('resize', resize);

  // ---------- three.js materials ----------
  // Particle shader: one gl_PointSize sprite per particle, drawn as a soft
  // radial glow in the fragment shader, with perspective size attenuation
  // (uSizeScale / -mvPosition.z) so particles nearer the camera read as
  // bigger and brighter — that falloff is a big part of what sells the
  // depth. Calibrated so a particle at world depth 0 renders at exactly
  // its original, pre-3D pixel size when the camera is front-on.
  const particleVS = `
    attribute vec3 aColor;
    attribute float aSize;
    attribute float aAlpha;
    uniform float uSizeScale;
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mvPosition;
      gl_PointSize = aSize * (uSizeScale / max(1.0, -mvPosition.z));
      vColor = aColor;
      vAlpha = aAlpha;
    }
  `;
  const particleFS = `
    precision mediump float;
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      // soft round sprite: fades to 0 at the edge of the point instead of
      // a hard square, mimicking the anti-aliased circle ctx.arc() drew
      vec2 d = gl_PointCoord - vec2(0.5);
      float dist = length(d) * 2.0;
      float a = smoothstep(1.0, 0.0, dist) * vAlpha;
      if (a <= 0.001) discard;
      gl_FragColor = vec4(vColor * a, a);
    }
  `;
  const particleMaterial = new THREE.ShaderMaterial({
    vertexShader: particleVS,
    fragmentShader: particleFS,
    uniforms: { uSizeScale: { value: camera.userData.orbitRadius || 800 } },
    transparent: true,
    depthTest: false,
    depthWrite: false,
    blending: THREE.AdditiveBlending // matches the old gl.blendFunc(SRC_ALPHA, ONE)
  });

  // Fullscreen-quad fade shader: draws the previous frame's texture back
  // into the new render target at reduced opacity. This IS the trail
  // effect — direct GPU equivalent of the old `ctx.fillRect` with a
  // translucent fill. Reused for two passes each frame: once to fade the
  // trail buffer, once (with uFadeAlpha = 0, a pure passthrough) to blit
  // the finished frame to the visible canvas.
  const fadeVS = `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `;
  const fadeFS = `
    precision mediump float;
    varying vec2 vUv;
    uniform sampler2D uPrev;
    uniform vec3 uBg;
    uniform float uFadeAlpha;
    void main() {
      vec3 prevColor = texture2D(uPrev, vUv).rgb;
      vec3 mixed = mix(prevColor, uBg, uFadeAlpha);
      gl_FragColor = vec4(mixed, 1.0);
    }
  `;
  const fadeMaterial = new THREE.ShaderMaterial({
    vertexShader: fadeVS,
    fragmentShader: fadeFS,
    uniforms: { uPrev: { value: null }, uBg: { value: new THREE.Color(0, 0, 0) }, uFadeAlpha: { value: 0 } },
    depthTest: false,
    depthWrite: false
  });
  const postScene = new THREE.Scene();
  const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), fadeMaterial));

  // Particle geometry — reused every frame, resized only when the particle
  // count changes, so no per-frame allocation.
  let particleCapacity = 0;
  let posArr, colorArr, sizeArr, alphaArr;
  let posAttr, colorAttr, sizeAttr, alphaAttr;
  const particleGeometry = new THREE.BufferGeometry();
  const points = new THREE.Points(particleGeometry, particleMaterial);
  points.frustumCulled = false; // the field moves every frame; skip bounds bookkeeping we'd have to keep recomputing anyway
  particleScene.add(points);

  function ensureParticleBuffers(n) {
    if (n <= particleCapacity) return;
    particleCapacity = n + 512; // small headroom so growth doesn't reallocate every single tick
    posArr = new Float32Array(particleCapacity * 3);
    colorArr = new Float32Array(particleCapacity * 3);
    sizeArr = new Float32Array(particleCapacity);
    alphaArr = new Float32Array(particleCapacity);
    posAttr = new THREE.BufferAttribute(posArr, 3).setUsage(THREE.DynamicDrawUsage);
    colorAttr = new THREE.BufferAttribute(colorArr, 3).setUsage(THREE.DynamicDrawUsage);
    sizeAttr = new THREE.BufferAttribute(sizeArr, 1).setUsage(THREE.DynamicDrawUsage);
    alphaAttr = new THREE.BufferAttribute(alphaArr, 1).setUsage(THREE.DynamicDrawUsage);
    particleGeometry.setAttribute('position', posAttr);
    particleGeometry.setAttribute('aColor', colorAttr);
    particleGeometry.setAttribute('aSize', sizeAttr);
    particleGeometry.setAttribute('aAlpha', alphaAttr);
  }

  resize();

  // ---------- Interaction modes ----------
  // These describe HOW touch pushes the always-on field of particles around,
  // not spawn effects — the particle count never changes when you touch.
  const MODES = ['Swirl', 'Repel', 'Attract', 'Orbit', 'Wind', 'Gravity Well', 'Comet', 'Sphere', 'Ripple', 'Slingshot'];
  let mode = 'Swirl';

  // ---------- Ripple mode state ----------
  // Every other mode is a continuous force that reads the CURRENT position
  // of each finger every frame. Ripple doesn't work that way — it fires a
  // discrete wave event (on tap, on drag, on release) that then expands on
  // its own as a ring over time, independent of where the finger goes next.
  // simTime (accumulated dt, not wall-clock time) drives that expansion so
  // ripple speed scales with the Speed slider like everything else does.
  let simTime = 0;
  let ripples = []; // { x, y, born, strength }
  const RIPPLE_SPEED = 6;         // px the wavefront expands per unit of simTime (simTime accrues ~60/sec at default speed, so this is ~360px/sec — a few seconds to cross a phone screen)
  const RIPPLE_BAND = 46;         // thickness of the ring that actually pushes particles
  const RIPPLE_MAX_RADIUS = 150; // ripples past this are culled
  const RIPPLE_TAP_STRENGTH = 1.1;
  const RIPPLE_DRAG_STRENGTH = 0.55;
  const RIPPLE_RELEASE_STRENGTH = 1.5;
  const RIPPLE_DRAG_INTERVAL = 90; // min simTime between ripples auto-spawned while dragging
  function spawnRipple(x, y, strength) {
    ripples.push({ x, y, born: simTime, strength });
  }

  // ---------- Slingshot mode state ----------
  // A finger touching down "loads" any nearby particles into a pouch
  // (pt.slingPointer set to that finger's id) — they tether to the finger
  // with a lagging spring for as long as it's held, same tension idea as
  // pulling back a real slingshot. Lifting the finger reads how far it
  // travelled from where it first went down (the fixed anchor) and fires
  // every loaded particle back through that anchor point.
  const SLING_CAPTURE_RADIUS = 95;
  const SLING_SPRING = 0.18;
  const SLING_LAUNCH_MULT = 0.16;
  const SLING_MAX_LAUNCH = 30;

  // ---------- Params ----------
  let targetCount = 250;  // desired number of particles on screen — set by slider
  let trailAmt = 45;      // 0-95 -> alpha of fade rect, controls trail length
  let sizeScale = 1;      // multiplier applied to every particle's radius
  let dragCoef = 0.999 - (34 / 100) * 0.099; // friction -> per-frame velocity retention
  let simSpeed = 1;      // multiplier applied to dt each frame — controls overall sim pace

  // ---------- Particle store (persistent field) ----------
  let particles = [];

  function rand(a, b) { return a + Math.random() * (b - a); }
  // Uniform random point on a unit sphere (not lat/long sampling, which
  // bunches points at the poles) — used to give each particle a fixed
  // "home" position on the Sphere mode shape.
  function randomSpherePoint() {
    const u = rand(-1, 1), th = rand(0, Math.PI * 2), r = Math.sqrt(1 - u * u);
    return { x: r * Math.cos(th), y: r * Math.sin(th), z: u };
  }
  function pickColor() {
    const c = PALETTES[paletteKey].colors;
    return c[(Math.random() * c.length) | 0];
  }

  // Small cache so converting a particle's hex color string to 0-1 floats
  // for the GPU buffer is a lookup, not a re-parse, 10,000 times a frame.
  const colorFloatCache = new Map();
  function colorFloat(hex) {
    let v = colorFloatCache.get(hex);
    if (!v) { v = hexToRgbFloat(hex); colorFloatCache.set(hex, v); }
    return v;
  }

  function makeParticle(x, y) {
    const a = rand(0, Math.PI * 2);
    const speed = rand(0.15, 0.5);
    const g = rand(0.7, 1.15);
    return {
      x: x !== undefined ? x : rand(0, W),
      y: y !== undefined ? y : rand(0, H),
      vx: Math.cos(a) * speed,
      vy: Math.sin(a) * speed,
      size: rand(1.4, 3.6),
      color: pickColor(),
      glow: g,
      baseGlow: g, // resting brightness — Comet mode boosts glow above this, then it decays back
      wobble: rand(0, Math.PI * 2),
      // spreads particles across a band of rings/orbits instead of all
      // converging onto one exact radius — keeps Orbit-family modes
      // visually alive instead of settling into a static, packed ring
      orbitJitter: rand(0.92, 1.08),
      spinJitter: rand(0.75, 1.3),
      teleportCooldown: 0, // frames left before this particle is allowed to hand off again
      // which role this particle plays in a two-finger Gravity Well bridge:
      // most particles coil around the line between the two wells, a
      // minority thread straight down the line itself
      strand: rand(0, 1) < 0.22 ? 'line' : 'coil',
      coilPhase: rand(0, Math.PI * 2), // offsets each coiling particle so they don't all swirl in lockstep
      coilSide: rand(0, 1) < 0.5 ? 1 : -1, // which side of the line this particle's strand winds on
      webOffset: rand(-22, 22), // perpendicular resting distance from a polygon edge for Attract/Wind's multi-finger web, so particles form a loose band instead of collapsing onto a single pixel-thin line
      slingPointer: null, // Slingshot mode: id of the finger this particle is currently loaded onto, or null if it's free
      slingOffsetX: 0, slingOffsetY: 0, // fixed offset from the capturing finger, set once at capture so the pouch keeps a loose shape instead of collapsing to a point
      // Sphere mode: a fixed point on a unit sphere, assigned once so the
      // same particle always sits at the same spot on the shape instead of
      // being reassigned every frame (which would just look like noise).
      ...(() => { const s = randomSpherePoint(); return { formX: s.x, formY: s.y, formZ: s.z }; })(),
      formTargetZ: 0,
      formActive: false,
      // depth (world Z) is purely a rendering concern — nothing above this
      // reads pt.z, so none of the touch-interaction math needed to change
      // to get real 3D. Each particle keeps a fixed base depth and gently
      // breathes around it on its own phase/speed so the volume always
      // feels alive, even before any audio or touch is layered on top.
      zBase: rand(-1, 1) * DEPTH,
      zWobble: rand(0, Math.PI * 2),
      zSpeed: rand(0.5, 1.15),
      z: 0
    };
  }

  // Smoothly grow or shrink the population toward targetCount.
  // Particles are permanent members of the field — they drift and get
  // pushed around, but they don't expire or get consumed by effects.
  function reconcilePopulation() {
    // step scales with how far we are from the target so huge jumps (e.g.
    // toward the 50000 cap) settle in a couple seconds, not a minute.
    const step = Math.max(6, Math.ceil(Math.abs(targetCount - particles.length) / 30));
    if (particles.length < targetCount) {
      for (let i = 0; i < step && particles.length < targetCount; i++) {
        particles.push(makeParticle());
      }
    } else if (particles.length > targetCount) {
      particles.splice(0, Math.min(step, particles.length - targetCount));
    }
  }

  // ---------- Pointer tracking (multi-touch) ----------
  const pointers = new Map(); // id -> {x,y,px,py,angle,vx,vy}

  function updatePointer(id, x, y) {
    let p = pointers.get(id);
    if (!p) {
      // anchorX/anchorY are set once here and never move again — Slingshot
      // reads them at release to know how far the pouch got stretched.
      p = { x, y, px: x, py: y, vx: 0, vy: 0, angle: rand(0, Math.PI * 2), t: 0, anchorX: x, anchorY: y, lastRipple: -Infinity };
      pointers.set(id, p);
    } else {
      p.px = p.x; p.py = p.y;
      p.x = x; p.y = y;
      p.vx = p.x - p.px;
      p.vy = p.y - p.py;
    }
  }
  function removePointer(id) { pointers.delete(id); }

  const RELEASE_STRENGTH = 6.5;
  const RELEASE_STRENGTH_BY_MODE = { Attract: 10, Orbit: 10.5, 'Gravity Well': 11 };

  // When a finger lifts, every particle gets a burst kick — the direction
  // depends on the active mode, not just "away from the touch point":
  //   Attract -> bursts outward from the clump's own center, blended with
  //              a jittered version of each particle's existing heading —
  //              a tightly packed group scatters apart instead of all
  //              drifting off together in the same direction
  //   Repel   -> radial burst away from the release point
  //   Swirl   -> tangential burst, continuing the spin direction
  //   Orbit   -> strong radial burst off the ring, with a little spin left
  //              over, like flinging off a carousel that's spinning apart
  //   Wind    -> burst along the direction the finger was last moving
  //   Gravity Well -> outward from the pack's own center, like Attract
  //   Comet   -> continues the trailing/repel behavior from the drag
  function releaseBurst(id) {
    const p = pointers.get(id);
    if (!p) return;

    // center of the current field — used so Attract/Orbit bursts scatter
    // outward from where the particles actually are, not just the touch
    let sumX = 0, sumY = 0;
    particles.forEach(pt => { sumX += pt.x; sumY += pt.y; });
    const centroidX = sumX / Math.max(1, particles.length);
    const centroidY = sumY / Math.max(1, particles.length);

    particles.forEach((pt) => {
      const dx = pt.x - p.x, dy = pt.y - p.y;
      const dist = Math.max(6, Math.hypot(dx, dy));
      const falloff = FALLOFF_REACH / (FALLOFF_REACH + dist);
      const nx = dx / dist, ny = dy / dist;
      const strength = RELEASE_STRENGTH_BY_MODE[mode] || RELEASE_STRENGTH;
      const kick = strength * falloff;

      switch (mode) {
        case 'Attract': {
          // outward from the pack's own center, not the touch point —
          // this is what actually separates particles that were moving
          // in lockstep, since their positions still differ even when
          // their velocities look identical
          const cdx = pt.x - centroidX, cdy = pt.y - centroidY;
          const cdist = Math.max(4, Math.hypot(cdx, cdy));
          const cnx = cdx / cdist, cny = cdy / cdist;

          const sp = Math.hypot(pt.vx, pt.vy);
          const headingAngle = sp > 0.01 ? Math.atan2(pt.vy, pt.vx) : Math.atan2(cny, cnx);
          const jitter = rand(-0.55, 0.55); // breaks up any uniform direction
          const burstAngle = headingAngle + jitter;

          pt.vx += Math.cos(burstAngle) * kick * 0.7 + cnx * kick * 0.9;
          pt.vy += Math.sin(burstAngle) * kick * 0.7 + cny * kick * 0.9;
          break;
        }
        case 'Repel': {
          pt.vx += nx * kick;
          pt.vy += ny * kick;
          break;
        }
        case 'Sphere': {
          // scatter off the globe's surface, same shape as Repel's burst
          pt.vx += nx * kick;
          pt.vy += ny * kick;
          break;
        }
        case 'Swirl': {
          pt.vx += -ny * kick;
          pt.vy += nx * kick;
          break;
        }
        case 'Orbit': {
          // strong radial burst off the ring, plus a jittered angle so
          // the whole ring doesn't fly apart as one rigid disc
          const jitter = rand(-0.5, 0.5);
          const burstAngle = Math.atan2(ny, nx) + jitter;
          pt.vx += Math.cos(burstAngle) * kick * 1.3;
          pt.vy += Math.sin(burstAngle) * kick * 1.3;
          // a little leftover spin so it reads as flying off a carousel
          pt.vx += -ny * kick * 0.35;
          pt.vy += nx * kick * 0.35;
          break;
        }
        case 'Wind': {
          const wsp = Math.hypot(p.vx, p.vy);
          if (wsp > 0.01) {
            pt.vx += (p.vx / wsp) * kick;
            pt.vy += (p.vy / wsp) * kick;
          }
          break;
        }
        case 'Gravity Well': {
          // same idea as Attract's burst — scatter outward from the pack's
          // own center so a tightly collapsed clump explodes apart rather
          // than drifting off as one rigid group
          const cdx = pt.x - centroidX, cdy = pt.y - centroidY;
          const cdist = Math.max(4, Math.hypot(cdx, cdy));
          const cnx = cdx / cdist, cny = cdy / cdist;
          pt.vx += cnx * kick;
          pt.vy += cny * kick;
          break;
        }
        case 'Comet': {
          // release continues whatever the drag was doing: trailing
          // particles keep being flung backward away from the motion,
          // or if the finger was held still, they get one last outward push
          const wsp = Math.hypot(p.vx, p.vy);
          if (dist < COMET_RADIUS * 1.5) {
            if (wsp > COMET_DRAG_THRESHOLD) {
              pt.vx -= (p.vx / wsp) * kick * 1.4;
              pt.vy -= (p.vy / wsp) * kick * 1.4;
            } else {
              pt.vx += nx * kick * 1.2;
              pt.vy += ny * kick * 1.2;
            }
            pt.glow = Math.min(2.2, pt.glow + 0.6);
          }
          break;
        }
      }
    });
  }

  // Grabs every particle currently near (x,y) into the pouch for pointer
  // `id`, recording each one's offset from the capture point so the pouch
  // keeps a loose cloud shape instead of collapsing onto a single pixel.
  function captureSlingshot(id, x, y) {
    particles.forEach((pt) => {
      const d = Math.hypot(pt.x - x, pt.y - y);
      if (d < SLING_CAPTURE_RADIUS) {
        pt.slingPointer = id;
        pt.slingOffsetX = pt.x - x;
        pt.slingOffsetY = pt.y - y;
      }
    });
  }

  // Fires whatever's loaded onto pointer `id` back through that finger's
  // anchor point (where it first touched down) — the further it was
  // stretched away from the anchor, the harder the launch.
  function releaseSlingshot(id) {
    const p = pointers.get(id);
    if (!p) return;
    const dx = p.anchorX - p.x, dy = p.anchorY - p.y; // "forward" = back through the anchor, opposite the pull
    const stretch = Math.hypot(dx, dy);
    if (stretch < 4) {
      // barely pulled — just let go, no real launch
      particles.forEach((pt) => { if (pt.slingPointer === id) pt.slingPointer = null; });
      return;
    }
    const ux = dx / stretch, uy = dy / stretch;
    const launchSpeed = Math.min(SLING_MAX_LAUNCH, stretch * SLING_LAUNCH_MULT);
    particles.forEach((pt) => {
      if (pt.slingPointer !== id) return;
      const jitter = rand(-0.12, 0.12); // small angular spread so the pouch fans out slightly instead of firing as one rigid line
      const ca = Math.cos(jitter), sa = Math.sin(jitter);
      pt.vx = (ux * ca - uy * sa) * launchSpeed * rand(0.85, 1.15);
      pt.vy = (ux * sa + uy * ca) * launchSpeed * rand(0.85, 1.15);
      pt.glow = Math.min(2.2, pt.glow + 0.9);
      pt.slingPointer = null;
    });
  }

  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    document.getElementById('hint').classList.add('hidden');
    const s = screenToSim(e.clientX, e.clientY);
    if (s) {
      updatePointer(e.pointerId, s.x, s.y);
      if (mode === 'Ripple') spawnRipple(s.x, s.y, RIPPLE_TAP_STRENGTH);
      else if (mode === 'Slingshot') captureSlingshot(e.pointerId, s.x, s.y);
    }
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    const s = screenToSim(e.clientX, e.clientY);
    if (s) {
      updatePointer(e.pointerId, s.x, s.y);
      // Dragging in Ripple mode also lays down waves as you go, throttled
      // so a fast swipe doesn't spawn hundreds of overlapping rings.
      if (mode === 'Ripple') {
        const p = pointers.get(e.pointerId);
        if (simTime - p.lastRipple > RIPPLE_DRAG_INTERVAL) {
          spawnRipple(s.x, s.y, RIPPLE_DRAG_STRENGTH);
          p.lastRipple = simTime;
        }
      }
    }
  });
  canvas.addEventListener('pointerup', (e) => {
    if (mode === 'Slingshot') {
      releaseSlingshot(e.pointerId);
    } else if (mode === 'Ripple') {
      const p = pointers.get(e.pointerId);
      if (p) spawnRipple(p.x, p.y, RIPPLE_RELEASE_STRENGTH);
    } else {
      releaseBurst(e.pointerId);
    }
    removePointer(e.pointerId);
  });
  canvas.addEventListener('pointercancel', (e) => {
    if (mode === 'Slingshot') {
      releaseSlingshot(e.pointerId);
    } else if (mode === 'Ripple') {
      const p = pointers.get(e.pointerId);
      if (p) spawnRipple(p.x, p.y, RIPPLE_RELEASE_STRENGTH);
    } else {
      releaseBurst(e.pointerId);
    }
    removePointer(e.pointerId);
  });

  // A gentle random kick applied to the existing field — never changes count.
  function scatterField() {
    particles.forEach((pt) => {
      const a = rand(0, Math.PI * 2);
      const kick = rand(1.5, 4);
      pt.vx += Math.cos(a) * kick;
      pt.vy += Math.sin(a) * kick;
    });
  }

  // How quickly the pull weakens with distance — no cutoff, so every
  // particle on screen is always influenced by every touch, just more
  // gently the farther away it is. Orbit uses a tighter reach so its
  // pull stays local instead of dragging the whole screen into a slow spin.
  const FALLOFF_REACH = 260;
  const REACH_BY_MODE = { Swirl: 260, Repel: 260, Attract: 260, Orbit: 190, Wind: 260, 'Gravity Well': 240, Comet: 260, Sphere: 260 };

  // Orbit settles particles onto a ring at this radius around the touch,
  // like a small gravity well, instead of a wide diffuse swirl.
  const ORBIT_RADIUS = 70;
  const ORBIT_SPRING = 0.07;
  const ORBIT_SPIN = 1.5;

  // Sphere: pulls the field into a rotating 3D globe centered on the touch,
  // using real depth (pt.z) instead of just x/y — this is the mode built
  // specifically to show off the field's 3D volume. Each particle springs
  // toward its fixed spot on the globe (formX/Y/Z, set once at creation)
  // rotated by the shared formSpin phase, which is what makes the whole
  // shape visibly turn in place.
  const SPHERE_SPRING = 0.07;
  const SPHERE_Z_SPRING = 0.12;
  let formSpin = 0;   // accumulated rotation around the vertical (Y) axis
  let formTilt = 0;   // accumulated rotation around the horizontal (X) axis
  let formSpinVel = 0; // current angular velocity, eased toward a target each frame — fingers are the only source
  let formTiltVel = 0;
  // How strongly a finger's own drag speed maps to spin/tilt velocity, and
  // how slowly the current velocity chases that target — the low EASE value
  // is the "legroom": small jitters in finger movement barely nudge the
  // spin, it only really picks up once a drag holds a direction for a bit.
  const FORM_DRAG_TO_SPIN = 0.012;
  const FORM_SPIN_EASE = 0.045;

  // One finger = sphere (globe), 2 = cube, 3 = pyramid, 4 = DNA double
  // helix, 5+ = torus (ring donut) — each function takes the particle's
  // fixed formX/Y/Z unit-sphere sample (assigned once at creation) and a
  // spin phase, and returns a { x, y, z } point (roughly unit scale) for
  // that shape. Reusing the same formX/Y/Z sample as a source of per-
  // particle randomness (instead of drawing new random numbers here) is
  // what keeps each particle glued to the same spot on the shape frame to
  // frame instead of jittering between spots.
  function shapePointSphere(pt) {
    return { x: pt.formX, y: pt.formY, z: pt.formZ };
  }
  function shapePointCube(pt) {
    // snap each axis of the particle's own sphere sample to whichever
    // face it's closest to (±1), so particles distribute themselves
    // across all 6 faces instead of piling onto one
    const ax = Math.abs(pt.formX), ay = Math.abs(pt.formY), az = Math.abs(pt.formZ);
    let x = pt.formX, y = pt.formY, z = pt.formZ;
    if (ax >= ay && ax >= az) x = Math.sign(pt.formX) || 1;
    else if (ay >= ax && ay >= az) y = Math.sign(pt.formY) || 1;
    else z = Math.sign(pt.formZ) || 1;
    return { x, y, z };
  }
  function shapePointPyramid(pt) {
    // base square in x/z, apex at +y — walk up from the particle's own
    // y-sample so particles distribute across all four faces plus base
    const t = (pt.formY + 1) / 2; // 0 at base, 1 at apex
    const half = 1 - t; // base footprint shrinks linearly toward the apex
    const ax = Math.abs(pt.formX), az = Math.abs(pt.formZ);
    let x = pt.formX, z = pt.formZ;
    if (ax >= az) x = (Math.sign(pt.formX) || 1) * half; else z = (Math.sign(pt.formZ) || 1) * half;
    // remaining axis still varies across the face instead of pinning to an edge
    if (ax >= az) z = pt.formZ * half; else x = pt.formX * half;
    return { x, y: t * 2 - 1, z };
  }
  function shapePointHelix(pt) {
    // two intertwined strands (a DNA double helix) — half the particles
    // (by coilSide) ride one strand, half the other, 180° apart. The whole
    // shape's spin comes from the same outer y-axis rotation every other
    // shape uses, so this only needs to lay out the static strand geometry.
    const turns = 2.4;
    const t = pt.formY; // -1..1 walk up the strand, reusing the sphere sample as free per-particle spread
    const strandOffset = pt.coilSide > 0 ? 0 : Math.PI;
    const angle = t * Math.PI * turns + strandOffset;
    const r = 0.55;
    return { x: Math.cos(angle) * r, y: t, z: Math.sin(angle) * r };
  }
  function shapePointTorus(pt) {
    // ring donut — formX/formZ angle picks position around the main ring,
    // formY plus a small tube radius picks position around the ring's
    // own cross-section
    const theta = Math.atan2(pt.formZ, pt.formX);
    const tube = 0.32;
    const phi = pt.formY * Math.PI;
    const ringR = 0.75 + Math.cos(phi) * tube;
    return { x: Math.cos(theta) * ringR, y: Math.sin(phi) * tube, z: Math.sin(theta) * ringR };
  }
  // fingerCount -> point function, so applyTouchForces just looks up the
  // right shape for however many touches are currently active
  const SHAPE_BY_FINGERS = { 1: shapePointSphere, 2: shapePointCube, 3: shapePointPyramid, 4: shapePointHelix, 5: shapePointTorus };
  function shapePointFor(fingerCount, pt) {
    const fn = SHAPE_BY_FINGERS[Math.min(5, fingerCount)] || shapePointSphere;
    return fn(pt);
  }

  // Comet only sweeps up particles that stray very close to the finger —
  // everything outside this radius gets just a faint drift toward it,
  // so the effect reads as a few bright streaks rather than a full field push.
  const COMET_RADIUS = 70;

  // How fast the finger has to be moving (in px/frame) before Comet treats
  // it as a "drag" rather than "held still". Raised well above raw jitter
  // noise so a finger resting in one spot doesn't flicker between the
  // explode and trailing behaviors from sub-pixel tremor alone.
  const COMET_DRAG_THRESHOLD = 0.6;

  // Apply the active interaction mode's force from every active touch
  // to a single particle. This is the ONLY way touch affects the field —
  // it steers particles that already exist, it never creates or destroys them.
  // Every particle is always in range; nothing is ever excluded by distance.
  // `activePointers` is a plain array built once per frame (see frame()) —
  // iterating it with a for-loop instead of calling pointers.forEach(...)
  // here avoids allocating a brand new closure for every one of the
  // thousands of particles on every single frame, which is what was
  // actually causing the stutter at high particle counts.
  function applyTouchForces(pt, dt, activePointers, polygon) {
    // Sphere mode picks ONE shared shape (by how many fingers are down)
    // centered on the centroid of every active finger, so 2+ fingers form
    // a single cube/pyramid/helix/torus rather than one copy per finger —
    // handled once here, up front, instead of inside the per-finger loop
    // below (which is built for effects that legitimately stack per touch).
    if (mode === 'Sphere') {
      if (activePointers.length > 0) {
        const cx = W / 2, cy = H / 2;

        const raw = shapePointFor(activePointers.length, pt);
        // tilt (around X) first, then spin (around Y) — tilt nods the
        // shape forward/back, spin turns it left/right, matching vertical
        // vs horizontal drag respectively
        const ct = Math.cos(formTilt), st = Math.sin(formTilt);
        const ty = raw.y * ct - raw.z * st;
        const tz = raw.y * st + raw.z * ct;
        const cs = Math.cos(formSpin), sn = Math.sin(formSpin);
        const rx = raw.x * cs - tz * sn;
        const rz = raw.x * sn + tz * cs;
        const targetX = cx + rx * SPHERE_RADIUS;
        const targetY = cy + ty * SPHERE_RADIUS;
        pt.vx += (targetX - pt.x) * SPHERE_SPRING * dt;
        pt.vy += (targetY - pt.y) * SPHERE_SPRING * dt;
        // z isn't velocity-driven — it's set directly in the depth block
        // further down the frame loop, which reads this target whenever
        // formActive is true for the frame
        pt.formTargetZ = rz * SPHERE_RADIUS;
        pt.formActive = true;
      }
      return;
    }

    // Ripple: ignores current finger position entirely — instead sweeps
    // through every active wave event, nudging any particle sitting inside
    // that wave's expanding ring outward, harder the closer it is to the
    // ring's leading edge and weaker the further the wave has already
    // traveled (so old ripples fade out instead of pushing forever).
    if (mode === 'Ripple') {
      for (let ri = 0; ri < ripples.length; ri++) {
        const r = ripples[ri];
        const age = simTime - r.born;
        const radius = age * RIPPLE_SPEED;
        if (radius > RIPPLE_MAX_RADIUS) continue;
        const dx = pt.x - r.x, dy = pt.y - r.y;
        const dist = Math.max(0.001, Math.hypot(dx, dy));
        const bandDist = dist - radius;
        if (Math.abs(bandDist) > RIPPLE_BAND) continue; // outside the current wavefront band, unaffected
        const nx = dx / dist, ny = dy / dist;
        const edge = 1 - Math.abs(bandDist) / RIPPLE_BAND; // 1 at the wave's center, fading toward its band edges
        const decay = Math.max(0, 1 - radius / RIPPLE_MAX_RADIUS); // wave weakens the further it's traveled
        const push = r.strength * edge * decay;
        pt.vx += nx * push * dt;
        pt.vy += ny * push * dt;
        if (edge > 0.5) pt.glow = Math.min(2.2, pt.glow + edge * 0.25);
      }
      return;
    }

    // Slingshot: only particles currently loaded onto a finger (pt.slingPointer
    // set by captureSlingshot on touchdown) do anything here — a lagging spring
    // pulling them toward that finger's current position, offset so the pouch
    // holds its shape rather than collapsing to a point. Free particles just
    // fall through to the ambient drift already applied earlier in frame().
    if (mode === 'Slingshot') {
      if (pt.slingPointer != null) {
        const p = pointers.get(pt.slingPointer);
        if (p) {
          const targetX = p.x + pt.slingOffsetX * 0.4;
          const targetY = p.y + pt.slingOffsetY * 0.4;
          pt.vx += (targetX - pt.x) * SLING_SPRING * dt;
          pt.vy += (targetY - pt.y) * SLING_SPRING * dt;
        } else {
          pt.slingPointer = null; // pointer vanished without a clean release — free it
        }
      }
      return;
    }

    // With 3+ fingers down, each pointer's individual pull below still
    // fires for every finger on every particle — that's what makes 2-finger
    // combos feel powerful, but left unscaled it means a "pull toward a
    // point" force (Attract, Orbit's ring spring, Wind's push) effectively
    // gets applied once per finger and stacks linearly, so 5 fingers pull
    // ~5x harder than 2 and collapse the field into a dense clump instead
    // of spreading it out. Tame just those spring-like forces down as more
    // fingers join; 1-2 fingers are untouched (scale stays 1) since that
    // behavior already works well.
    const pointerScale = activePointers.length > 2 ? Math.min(1, 2 / activePointers.length) : 1;

    for (let pi = 0; pi < activePointers.length; pi++) {
      const p = activePointers[pi];
      const dx = pt.x - p.x, dy = pt.y - p.y;
      const dist = Math.max(6, Math.hypot(dx, dy));
      const reach = REACH_BY_MODE[mode] || FALLOFF_REACH;
      const falloff = reach / (reach + dist); // never reaches zero
      const nx = dx / dist, ny = dy / dist;

      switch (mode) {
        case 'Swirl': {
          // tangential force, like stirring a fluid. With 3+ fingers,
          // alternate spin direction finger-to-finger (even index CW, odd
          // index CCW) instead of everything spinning the same way — this
          // is what gives Swirl its own identity as turbulence (eddies
          // fighting each other) rather than Orbit's clean single rotation.
          const spinSign = activePointers.length >= 3 && (pi % 2 === 1) ? -1 : 1;
          pt.vx += -ny * falloff * 0.9 * dt * spinSign;
          pt.vy += nx * falloff * 0.9 * dt * spinSign;
          break;
        }
        case 'Repel': {
          // push outward, strongest close to the finger, falling off fast —
          // combined with edge containment this builds a dense pressure
          // ring instead of just draining particles to the border
          pt.vx += nx * falloff * falloff * 2.4 * dt;
          pt.vy += ny * falloff * falloff * 2.4 * dt;
          break;
        }
        case 'Attract': {
          pt.vx -= nx * falloff * 0.7 * dt * pointerScale;
          pt.vy -= ny * falloff * 0.7 * dt * pointerScale;
          break;
        }
        case 'Orbit': {
          // Each particle targets its own ring radius (varied by orbitJitter)
          // that also breathes slowly over time via its wobble phase, and
          // spins at its own slightly-different rate (spinJitter). Without
          // this every particle would converge onto the exact same radius
          // at the exact same phase and just look like a static, packed
          // ring — varying it keeps the whole halo visibly alive and in
          // motion instead of settling into one "final" frozen shape.
          const targetRadius = ORBIT_RADIUS * pt.orbitJitter * (1 + 0.18 * Math.sin(pt.wobble * 0.6));
          const springForce = (dist - targetRadius) * ORBIT_SPRING;
          pt.vx -= nx * springForce * dt * pointerScale;
          pt.vy -= ny * springForce * dt * pointerScale;
          // spin is rotational, not a pull toward a point, so it doesn't
          // stack into a clump the way the radial spring does — left
          // unscaled so the rings still visibly spin with more fingers down
          pt.vx += -ny * ORBIT_SPIN * pt.spinJitter * falloff * dt;
          pt.vy += nx * ORBIT_SPIN * pt.spinJitter * falloff * dt;
          break;
        }
        case 'Wind': {
          // pushes everything nearby in the direction the finger is moving
          pt.vx += p.vx * falloff * 0.6 * dt * pointerScale;
          pt.vy += p.vy * falloff * 0.6 * dt * pointerScale;
          break;
        }
        case 'Gravity Well': {
          // inverse-square-ish pull — weak from far away, but it ramps up
          // sharply as particles close in, so instead of settling calmly
          // like Attract, fast-moving particles sling past the center and
          // get pulled back around, overshooting again and again
          const g = Math.min(90, (reach * reach) / (dist * dist));
          pt.vx -= nx * g * 0.016 * dt;
          pt.vy -= ny * g * 0.016 * dt;
          break;
        }
        case 'Comet': {
          // only particles inside the tight comet radius get swept up.
          // Held still, the finger acts like a shockwave and pushes them
          // outward; dragged, it acts like a tail being dragged through
          // the field — particles get shoved backward, opposite the
          // direction of motion, so they trail behind instead of chasing
          // it. Nothing outside the radius is pulled in — it just gets a
          // faint outward nudge so the mode never sucks particles toward
          // the finger, only ever blows them away.
          if (dist < COMET_RADIUS) {
            const near = 1 - dist / COMET_RADIUS;
            const wsp = Math.hypot(p.vx, p.vy);
            if (wsp > COMET_DRAG_THRESHOLD) {
              pt.vx -= (p.vx / wsp) * near * near * 5.5 * dt;
              pt.vy -= (p.vy / wsp) * near * near * 5.5 * dt;
            } else {
              pt.vx += nx * near * near * 4.5 * dt;
              pt.vy += ny * near * near * 4.5 * dt;
            }
            pt.glow = Math.min(2.2, pt.glow + near * 0.1 * dt);
          } else {
            pt.vx += nx * falloff * 0.05 * dt;
            pt.vy += ny * falloff * 0.05 * dt;
          }
          break;
        }
      }
    }

    // Two-finger combos — an extra force layered on top of each finger's
    // individual pull, computed once using both touch points together.
    // Every mode gets its own combo so a second finger genuinely changes
    // the shape of the effect rather than just adding a second copy of it.
    if (activePointers.length === 2) {
      applyComboForce(pt, dt, activePointers[0], activePointers[1]);
    } else if (activePointers.length >= 3) {
      // 3+ finger combos — the touches now define a polygon instead of a
      // single line, so the "extra" behavior layered on top is shape-based:
      // a ring for Gravity Well, a cage for Repel, a shared rotation for
      // Swirl/Orbit around the centroid of every active touch.
      applyMultiForce(pt, dt, activePointers, polygon);
    }
  }

  // Keeps two-finger Attract / Gravity Well alive instead of dying out once
  // particles clump onto one of the two fingers. Once a particle has settled
  // right on top of a finger it has nowhere left to go — this quietly moves
  // it just past the *other* finger and aims it back across the midpoint
  // toward the first, so it keeps sweeping the whole gap between the two
  // touches rather than sitting in a dead pile at either end.
  const HANDOFF_RADIUS = 16; // how "clumped onto a finger" has to look before it hands off
  const HANDOFF_COOLDOWN = 45; // frames before a particle is eligible to hand off again
  function handoffTeleport(pt, dt, p1, p2) {
    if (pt.teleportCooldown > 0) { pt.teleportCooldown -= dt; return; }

    const d1 = Math.hypot(pt.x - p1.x, pt.y - p1.y);
    const d2 = Math.hypot(pt.x - p2.x, pt.y - p2.y);
    let from = null, to = null;
    if (d1 < HANDOFF_RADIUS) { from = p1; to = p2; }
    else if (d2 < HANDOFF_RADIUS) { from = p2; to = p1; }
    if (!from) return;

    // land just beyond the target finger, on the far side away from "from" —
    // so the particle's very next step re-enters the segment between the
    // two fingers and has to cross the midpoint to reach "from" again
    const dx = to.x - from.x, dy = to.y - from.y;
    const dist = Math.max(1, Math.hypot(dx, dy));
    const ux = dx / dist, uy = dy / dist; // unit vector from -> to

    const overshoot = rand(HANDOFF_RADIUS * 1.1, HANDOFF_RADIUS * 1.8);
    const jitter = rand(-10, 10);
    pt.x = to.x + ux * overshoot + -uy * jitter;
    pt.y = to.y + uy * overshoot + ux * jitter;

    // velocity aimed back along the line toward "from", so it immediately
    // starts traversing the midpoint instead of pausing at the new well
    const speed = rand(1.6, 2.6);
    pt.vx = -ux * speed;
    pt.vy = -uy * speed;
    pt.glow = Math.min(2.2, pt.glow + 0.5);

    pt.teleportCooldown = HANDOFF_COOLDOWN + rand(-10, 10);
  }

  function applyComboForce(pt, dt, p1, p2) {
    const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
    const segDx = p2.x - p1.x, segDy = p2.y - p1.y;
    const segLen = Math.max(1, Math.hypot(segDx, segDy));
    const ux = segDx / segLen, uy = segDy / segLen; // unit vector along the line between the two fingers

    // closest point on the finger-to-finger segment, clamped to its ends
    const t = Math.max(0, Math.min(1, ((pt.x - p1.x) * ux + (pt.y - p1.y) * uy) / segLen));
    const closestX = p1.x + ux * segLen * t, closestY = p1.y + uy * segLen * t;
    const pdx = pt.x - closestX, pdy = pt.y - closestY;
    const pdist = Math.max(6, Math.hypot(pdx, pdy));
    const pnx = pdx / pdist, pny = pdy / pdist; // perpendicular direction away from the line

    const reach = REACH_BY_MODE[mode] || FALLOFF_REACH;
    const falloff = reach / (reach + pdist);

    switch (mode) {
      case 'Swirl': {
        // binary vortex — particles orbit the shared midpoint of both
        // fingers instead of circling each fingertip on its own
        const mdx = pt.x - mx, mdy = pt.y - my;
        const mdist = Math.max(6, Math.hypot(mdx, mdy));
        const mnx = mdx / mdist, mny = mdy / mdist;
        const mfall = reach / (reach + mdist);
        pt.vx += -mny * mfall * 0.55 * pt.spinJitter * dt;
        pt.vy += mnx * mfall * 0.55 * pt.spinJitter * dt;
        break;
      }
      case 'Repel': {
        // pressure wall — pushed away from the line connecting the two
        // fingers rather than two separate circular repel zones
        pt.vx += pnx * falloff * falloff * 2.0 * dt;
        pt.vy += pny * falloff * falloff * 2.0 * dt;
        break;
      }
      case 'Attract': {
        // bridge — pulled toward the nearest point on the line, so
        // particles between the two fingers stretch into a taut strand
        pt.vx -= pnx * falloff * 0.9 * dt;
        pt.vy -= pny * falloff * 0.9 * dt;
        handoffTeleport(pt, dt, p1, p2);
        break;
      }
      case 'Orbit': {
        // binary star — the two orbit rings slowly revolve around their
        // shared midpoint, on top of each particle circling its own ring
        const mdx = pt.x - mx, mdy = pt.y - my;
        const mdist = Math.max(6, Math.hypot(mdx, mdy));
        const mnx = mdx / mdist, mny = mdy / mdist;
        const mfall = reach / (reach + mdist);
        pt.vx += -mny * mfall * 0.35 * pt.spinJitter * dt;
        pt.vy += mnx * mfall * 0.35 * pt.spinJitter * dt;
        break;
      }
      case 'Wind': {
        // funnel — drawn onto the line between the fingers, then swept
        // along it, like wind being channeled through a corridor
        pt.vx -= pnx * falloff * 0.5 * dt;
        pt.vy -= pny * falloff * 0.5 * dt;
        pt.vx += ux * falloff * 0.4 * dt;
        pt.vy += uy * falloff * 0.4 * dt;
        break;
      }
      case 'Gravity Well': {
        // twin-strand bridge — a minority of particles ('line') get pulled
        // hard onto the exact segment between the two wells, forming a taut
        // bright core. Everyone else ('coil') gets pulled toward a target
        // offset from that line that winds sinusoidally along its length
        // and drifts over time, so they wrap around the core like a coil
        // instead of just orbiting whichever well is nearer.
        if (pt.strand === 'line') {
          pt.vx -= pnx * falloff * falloff * 2.6 * dt;
          pt.vy -= pny * falloff * falloff * 2.6 * dt;
        } else {
          const COIL_AMPLITUDE = 34;
          const COIL_FREQ = 5.5; // winds per full finger-to-finger span
          const coilTarget = pt.coilSide * COIL_AMPLITUDE *
            Math.sin(t * Math.PI * COIL_FREQ + pt.coilPhase + pt.wobble * 0.5);
          // signed perpendicular distance from the line: positive on the
          // pnx/pny side, negative on the other — lets coilTarget swing
          // particles across both sides of the line as t sweeps along it
          const signedDist = pdx * pnx + pdy * pny;
          const springForce = (signedDist - coilTarget) * 0.05;
          pt.vx -= pnx * springForce * dt;
          pt.vy -= pny * springForce * dt;
          // gentle pull along the line so coil particles stay strung
          // between the two wells rather than drifting off past either end
          pt.vx += ux * falloff * falloff * 0.5 * dt * (t < 0.5 ? 1 : -1);
          pt.vy += uy * falloff * falloff * 0.5 * dt * (t < 0.5 ? 1 : -1);
        }
        handoffTeleport(pt, dt, p1, p2);
        break;
      }
      case 'Comet': {
        // crossfire — particles caught inside both comet radii at once
        // get flung sideways off the line, like two streams colliding
        const d1 = Math.hypot(pt.x - p1.x, pt.y - p1.y);
        const d2 = Math.hypot(pt.x - p2.x, pt.y - p2.y);
        if (d1 < COMET_RADIUS && d2 < COMET_RADIUS) {
          pt.vx += pnx * 6 * dt;
          pt.vy += pny * 6 * dt;
          pt.glow = Math.min(2.2, pt.glow + 0.15 * dt);
        }
        break;
      }
    }
  }

  // ---------- 3+ finger combos ----------
  // With 3+ touches down, the fingers stop describing a single line and
  // start describing a polygon. buildPolygon() orders the raw touch points
  // by angle around their shared centroid (so the edges trace a simple,
  // non-self-intersecting loop even if the fingers were placed or listed
  // out of order) and precomputes each edge's direction, outward normal,
  // and position along the total perimeter. This runs once per frame in
  // frame(), NOT once per particle — with up to 5 points the sort is
  // trivial, but doing it 10,000+ times a frame would not be.
  function buildPolygon(points) {
    const n = points.length;
    let cx = 0, cy = 0;
    for (let i = 0; i < n; i++) { cx += points[i].x; cy += points[i].y; }
    cx /= n; cy /= n;

    const ordered = points.slice().sort((a, b) =>
      Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx));

    const edges = [];
    let perimeter = 0;
    for (let i = 0; i < n; i++) {
      const p1 = ordered[i], p2 = ordered[(i + 1) % n];
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const segLen = Math.max(1, Math.hypot(dx, dy));
      const ux = dx / segLen, uy = dy / segLen;
      // outward normal — start with one perpendicular candidate, flip it
      // if it happens to point back toward the centroid instead of away
      let nx = -uy, ny = ux;
      const midX = (p1.x + p2.x) / 2, midY = (p1.y + p2.y) / 2;
      if ((midX - cx) * nx + (midY - cy) * ny < 0) { nx = -nx; ny = -ny; }
      edges.push({ p1, p2, ux, uy, nx, ny, segLen, perimStart: perimeter });
      perimeter += segLen;
    }

    // shared "spin" of the whole touch cluster — average tangential
    // velocity of every finger relative to the centroid. Used by Wind's
    // multi-finger cyclone: dragging fingers around each other (rather
    // than straight-line dragging) builds up a shared rotation.
    let spin = 0;
    for (let i = 0; i < n; i++) {
      const p = points[i];
      const dx = p.x - cx, dy = p.y - cy;
      const dist = Math.max(1, Math.hypot(dx, dy));
      const tx = -dy / dist, ty = dx / dist;
      spin += (p.vx || 0) * tx + (p.vy || 0) * ty;
    }
    spin /= n;

    return { cx, cy, edges, perimeter, points: ordered, spin };
  }

  // Finds the nearest polygon edge to a particle, and where along that
  // edge (t, clamped to the segment) the closest point sits. Shared by
  // every multi-finger mode that pulls particles toward the shape's
  // boundary (Attract, Wind, Gravity Well, Repel), computed fresh per
  // particle since the closest edge differs particle to particle, but the
  // polygon itself (edges, ordering, centroid) is only built once per frame.
  function nearestEdgeInfo(pt, polygon) {
    let best = null, bestDist = Infinity, bestT = 0;
    for (let i = 0; i < polygon.edges.length; i++) {
      const e = polygon.edges[i];
      const t = Math.max(0, Math.min(1, ((pt.x - e.p1.x) * e.ux + (pt.y - e.p1.y) * e.uy) / e.segLen));
      const cx2 = e.p1.x + e.ux * e.segLen * t, cy2 = e.p1.y + e.uy * e.segLen * t;
      const d = Math.hypot(pt.x - cx2, pt.y - cy2);
      if (d < bestDist) { bestDist = d; best = e; bestT = t; }
    }
    return { edge: best, dist: bestDist, t: bestT };
  }

  // Standard ray-casting point-in-polygon test, used by Repel's cage.
  function pointInPolygon(x, y, ordered) {
    let inside = false;
    for (let i = 0, j = ordered.length - 1; i < ordered.length; j = i++) {
      const xi = ordered[i].x, yi = ordered[i].y;
      const xj = ordered[j].x, yj = ordered[j].y;
      const intersect = ((yi > y) !== (yj > y)) &&
        (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  // Generalized version of handoffTeleport for 3+ fingers: instead of
  // bouncing between exactly two wells, a particle that clumps onto any
  // vertex hops to the NEXT vertex around the ring and keeps its velocity
  // pointed the same way it was already traveling around the loop — so
  // with N fingers down, particles keep circulating the whole ring instead
  // of pooling at one corner. (With exactly 2 points this degenerates into
  // the same back-and-forth as the two-finger version.)
  function handoffTeleportPolygon(pt, dt, polygon) {
    if (pt.teleportCooldown > 0) { pt.teleportCooldown -= dt; return; }

    const pts = polygon.points;
    let nearestIdx = -1, nearestDist = HANDOFF_RADIUS;
    for (let i = 0; i < pts.length; i++) {
      const d = Math.hypot(pt.x - pts[i].x, pt.y - pts[i].y);
      if (d < nearestDist) { nearestDist = d; nearestIdx = i; }
    }
    if (nearestIdx === -1) return;

    const from = pts[nearestIdx];
    const to = pts[(nearestIdx + 1) % pts.length]; // always advance forward around the ring
    const dx = to.x - from.x, dy = to.y - from.y;
    const dist = Math.max(1, Math.hypot(dx, dy));
    const ux = dx / dist, uy = dy / dist;

    const overshoot = rand(HANDOFF_RADIUS * 1.1, HANDOFF_RADIUS * 1.8);
    const jitter = rand(-10, 10);
    pt.x = to.x + ux * overshoot + -uy * jitter;
    pt.y = to.y + uy * overshoot + ux * jitter;

    const speed = rand(1.6, 2.6);
    pt.vx = ux * speed; // keep moving FORWARD around the ring, toward the vertex after "to"
    pt.vy = uy * speed;
    pt.glow = Math.min(2.2, pt.glow + 0.5);

    pt.teleportCooldown = HANDOFF_COOLDOWN + rand(-10, 10);
  }

  function applyMultiForce(pt, dt, activePointers, polygon) {
    switch (mode) {
      case 'Swirl': {
        // Turbulence identity now lives in the per-pointer loop above
        // (alternating spin direction per finger); no extra shared-centroid
        // rotation here, so Swirl reads as fighting eddies rather than one
        // clean rotation — that's what separates it from Orbit below.
        break;
      }
      case 'Orbit': {
        // small star cluster — each finger still holds its own ring, and
        // the whole cluster of rings slowly revolves around their shared
        // centroid, same idea as the two-finger binary star, generalized.
        // Kept gentle since the per-finger ring springs above (now scaled
        // down by pointerScale as more fingers join) already do most of
        // the work — this is just the slow shared drift on top.
        const mdx = pt.x - polygon.cx, mdy = pt.y - polygon.cy;
        const mdist = Math.max(6, Math.hypot(mdx, mdy));
        const mnx = mdx / mdist, mny = mdy / mdist;
        const reach = REACH_BY_MODE.Orbit;
        const mfall = reach / (reach + mdist);
        pt.vx += -mny * mfall * 0.18 * pt.spinJitter * dt;
        pt.vy += mnx * mfall * 0.18 * pt.spinJitter * dt;
        break;
      }
      case 'Repel': {
        // cage — particles trapped inside the polygon get blown outward
        // through whichever edge is nearest, like pressure finding the
        // thinnest wall of a balloon. Particles already outside are left
        // to the normal per-finger repel from the loop above.
        if (!polygon || !pointInPolygon(pt.x, pt.y, polygon.points)) break;
        const info = nearestEdgeInfo(pt, polygon);
        if (info.edge) {
          pt.vx += info.edge.nx * 2.2 * dt;
          pt.vy += info.edge.ny * 2.2 * dt;
        }
        break;
      }
      case 'Attract': {
        // web — pulled toward the nearest edge of the polygon traced by
        // every active touch, so particles between any two neighboring
        // fingers stretch into a loose strand. Each particle springs
        // toward its own fixed perpendicular offset (webOffset) and a
        // fixed point along the edge's length (via coilPhase) instead of
        // a hard zero-distance target, so a whole crowd of particles
        // spreads into a soft band along the shape instead of collapsing
        // onto a single thin line or piling up at one spot on it.
        if (!polygon) break;
        const info = nearestEdgeInfo(pt, polygon);
        if (!info.edge) break;
        const e = info.edge;
        const closestX = e.p1.x + e.ux * e.segLen * info.t;
        const closestY = e.p1.y + e.uy * e.segLen * info.t;
        const pdx = pt.x - closestX, pdy = pt.y - closestY;
        const pdist = Math.max(6, info.dist);
        const pnx = pdx / pdist, pny = pdy / pdist;
        const reach = REACH_BY_MODE.Attract;
        const falloff = reach / (reach + pdist);

        const signedDist = pdx * pnx + pdy * pny;
        const springForce = (signedDist - pt.webOffset) * falloff * 0.35;
        pt.vx -= pnx * springForce * dt;
        pt.vy -= pny * springForce * dt;

        // gentle pull toward this particle's own fixed point along the
        // edge, so particles fan out along its length instead of bunching
        const targetT = 0.5 + 0.5 * Math.sin(pt.coilPhase);
        const tPull = (targetT - info.t) * falloff * 0.4;
        pt.vx += e.ux * tPull * dt;
        pt.vy += e.uy * tPull * dt;
        break;
      }
      case 'Wind': {
        // cyclone — pulled onto the nearest edge of the shape traced by
        // every finger and swept along it, same corridor idea as the
        // two-finger funnel but softened with the same per-particle
        // spread (webOffset / coilPhase) as multi-finger Attract, so the
        // corridor stays a wide band instead of collapsing into one dense
        // streak; on top of that the whole system picks up a shared spin
        // from how the fingers are moving relative to each other
        // (polygon.spin), so dragging fingers around one another builds
        // up a storm instead of just several separate corridors
        if (!polygon) break;
        const info = nearestEdgeInfo(pt, polygon);
        if (!info.edge) break;
        const e = info.edge;
        const closestX = e.p1.x + e.ux * e.segLen * info.t;
        const closestY = e.p1.y + e.uy * e.segLen * info.t;
        const pdx = pt.x - closestX, pdy = pt.y - closestY;
        const pdist = Math.max(6, info.dist);
        const pnx = pdx / pdist, pny = pdy / pdist;
        const reach = REACH_BY_MODE.Wind;
        const falloff = reach / (reach + pdist);

        const signedDist = pdx * pnx + pdy * pny;
        const springForce = (signedDist - pt.webOffset) * falloff * 0.18;
        pt.vx -= pnx * springForce * dt;
        pt.vy -= pny * springForce * dt;
        pt.vx += e.ux * falloff * 0.3 * dt;
        pt.vy += e.uy * falloff * 0.3 * dt;

        const mdx = pt.x - polygon.cx, mdy = pt.y - polygon.cy;
        const mdist = Math.max(6, Math.hypot(mdx, mdy));
        const mtx = -mdy / mdist, mty = mdx / mdist;
        const mfall = reach / (reach + mdist);
        pt.vx += mtx * polygon.spin * mfall * 0.35 * dt;
        pt.vy += mty * polygon.spin * mfall * 0.35 * dt;
        break;
      }
      case 'Comet': {
        // multi-crossfire — any pair of neighboring fingers that both
        // have this particle inside their comet radius flings it side-
        // ways off that edge, so 3+ fingers create several crossfire
        // seams around the shape instead of just one
        if (!polygon) break;
        for (let i = 0; i < polygon.edges.length; i++) {
          const e = polygon.edges[i];
          const d1 = Math.hypot(pt.x - e.p1.x, pt.y - e.p1.y);
          const d2 = Math.hypot(pt.x - e.p2.x, pt.y - e.p2.y);
          if (d1 < COMET_RADIUS && d2 < COMET_RADIUS) {
            pt.vx += e.nx * 6 * dt;
            pt.vy += e.ny * 6 * dt;
            pt.glow = Math.min(2.2, pt.glow + 0.15 * dt);
          }
        }
        break;
      }
      case 'Gravity Well': {
        // ring — a closed loop of wells instead of a single bridge. Same
        // line/coil roles as the two-finger version, but the coil's phase
        // is now driven by position along the WHOLE perimeter, so the
        // winding pattern is continuous all the way around the ring
        // instead of resetting at each edge, and handoffTeleportPolygon
        // keeps particles circulating the ring instead of pooling at
        // any one finger.
        if (!polygon) break;
        const info = nearestEdgeInfo(pt, polygon);
        if (!info.edge) break;
        const best = info.edge, bestT = info.t, bestDist = info.dist;

        const closestX = best.p1.x + best.ux * best.segLen * bestT;
        const closestY = best.p1.y + best.uy * best.segLen * bestT;
        const pdx = pt.x - closestX, pdy = pt.y - closestY;
        const pdist = Math.max(6, bestDist);
        const pnx = pdx / pdist, pny = pdy / pdist;
        const reach = REACH_BY_MODE['Gravity Well'];
        const falloff = reach / (reach + pdist);
        const globalT = (best.perimStart + bestT * best.segLen) / polygon.perimeter;

        if (pt.strand === 'line') {

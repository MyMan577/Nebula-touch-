<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Nebula Touch</title>

<!-- PWA setup -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05050a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nebula">

<style>
  :root {
    --bg: #05050a;
    --panel: rgba(12, 12, 20, 0.72);
    --panel-border: rgba(255, 255, 255, 0.08);
    --ink: #eef0f6;
    --ink-dim: #8a8ea3;
    --accent: #7df9ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    touch-action: none;
    overscroll-behavior: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: block;
  }

  /* Title flash on load */
  #title-card {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none;
    z-index: 5;
    animation: fadeOut 2.2s ease forwards;
  }
  #title-card h1 {
    font-weight: 200;
    letter-spacing: 0.4em;
    margin: 0;
    color: #fff;
    text-shadow: 0 0 40px rgba(125, 249, 255, 0.6);
    font-size: clamp(32px, 10vw, 56px);
  }
  #title-card p {
    margin-top: 10px;
    letter-spacing: 0.3em;
    font-size: 11px;
    color: var(--ink-dim);
    text-transform: uppercase;
  }
  @keyframes fadeOut {
    0% { opacity: 1; }
    55% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Top status bar */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: max(14px, env(safe-area-inset-top)) 18px 10px;
    z-index: 3;
    pointer-events: none;
  }
  #topbar .brand {
    font-size: 12px;
    letter-spacing: 0.28em;
    color: var(--ink-dim);
    text-transform: uppercase;
  }
  #fps {
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.1em;
    font-variant-numeric: tabular-nums;
  }

  /* Bottom control dock */
  #dock {
    position: fixed; left: 0; right: 0; bottom: 0;
    z-index: 4;
    padding: 0 14px max(14px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 10px;
    background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0));
    transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.32s ease;
    max-height: 82vh;
  }
  #dock.hidden {
    transform: translateY(115%);
    opacity: 0;
    pointer-events: none;
  }

  #dockHandle {
    align-self: center;
    width: 44px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-dim);
    font-size: 14px;
    cursor: pointer;
  }

  #showDockBtn {
    position: fixed;
    left: 50%; bottom: max(12px, env(safe-area-inset-bottom));
    transform: translateX(-50%) scale(0.85);
    z-index: 6;
    width: 44px; height: 30px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: var(--ink-dim);
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease, transform 0.28s ease;
  }
  #showDockBtn.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) scale(1);
  }

  .mode-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .mode-row::-webkit-scrollbar { display: none; }

  .chip {
    flex: 0 0 auto;
    padding: 9px 16px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: var(--ink-dim);
    font-size: 13px;
    letter-spacing: 0.02em;
    white-space: nowrap;
    transition: color 0.2s, border-color 0.2s, background 0.2s;
  }
  .chip.active {
    color: #05050a;
    background: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }

  #panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding: 14px 16px 16px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    max-height: calc(82vh - 50px); /* leaves room for the mode row + handle above it */
    overscroll-behavior: contain;
  }

  .panel-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  .panel-head .label {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-dim);
  }
  #clearBtn {
    background: none; border: none; color: var(--ink-dim);
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 4px 0;
  }
  #fpsCapBtn, #reactiveBtn {
    background: none; border: 1px solid rgba(255,255,255,0.25); border-radius: 999px;
    color: var(--ink-dim); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 4px 10px; margin-left: 10px;
  }
  #fpsCapBtn.active, #reactiveBtn.active { color: var(--ink); border-color: var(--accent); background: rgba(125,249,255,0.12); }
  #reactiveBtn:disabled { opacity: 0.45; }

  .playlist-item {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; padding: 6px 8px; font-size: 12px; color: var(--ink-dim);
  }
  .playlist-item.active { border-color: rgba(255,255,255,0.6); color: var(--ink); }
  .playlist-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .playlist-item button {
    background: none; border: none; color: inherit; font-size: 13px; padding: 2px 4px; opacity: 0.7;
  }
  .playlist-item button:hover { opacity: 1; }

  .palette-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .swatch {
    flex: 1;
    height: 40px;
    border-radius: 12px;
    border: 1.5px solid transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: rgba(255,255,255,0.85);
    position: relative;
    overflow: hidden;
  }
  .swatch.active { border-color: rgba(255,255,255,0.9); }
  .swatch span { position: relative; z-index: 1; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }

  .slider-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
  .slider-row { display: flex; justify-content: space-between; align-items: center; }
  .slider-row .label { font-size: 12px; color: var(--ink-dim); letter-spacing: 0.02em; text-transform: none; }
  .slider-row .value { font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums; }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.14);
    margin: 6px 0 14px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px rgba(125, 249, 255, 0.7);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 20px; height: 20px; border: none; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px rgba(125, 249, 255, 0.7);
  }

  #hint {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: rgba(255,255,255,0.35);
    font-size: 13px;
    letter-spacing: 0.08em;
    pointer-events: none;
    z-index: 2;
    animation: hintPulse 3s ease-in-out infinite;
  }
  @keyframes hintPulse {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 0.55; }
  }
  #hint.hidden { display: none; }
</style>
</head>
<body>

<canvas id="stage"></canvas>

<div id="title-card">
  <h1>NEBULA</h1>
  <p>a living field</p>
</div>

<div id="topbar">
  <div class="brand">Nebula Touch</div>
  <div id="fps"></div>
</div>

<div id="hint">drag to stir the field</div>

<div id="dock">
  <div id="dockHandle">⌄</div>
  <div class="mode-row" id="modeRow"></div>
  <div id="panel">
    <div class="panel-head">
      <div class="label">Palette</div>
      <div style="display:flex; align-items:center;">
        <button id="fpsCapBtn">60fps cap: off</button>
        <button id="clearBtn" style="margin-left:10px;">Scatter</button>
      </div>
    </div>
    <div class="palette-row" id="paletteRow"></div>

    <div class="slider-group">
      <div class="slider-row"><span class="label">Particles</span><span class="value" id="densityVal">250</span></div>
      <input type="range" id="densitySlider" min="100" max="10000" value="250">
      <div class="slider-row"><span class="label">Trail</span><span class="value" id="trailVal">45</span></div>
      <input type="range" id="trailSlider" min="0" max="95" value="45">
      <div class="slider-row"><span class="label">Size</span><span class="value" id="sizeVal">100</span></div>
      <input type="range" id="sizeSlider" min="40" max="220" value="100">
      <div class="slider-row"><span class="label">Friction</span><span class="value" id="frictionVal">34</span></div>
      <input type="range" id="frictionSlider" min="0" max="100" value="34">
      <div class="slider-row"><span class="label">Speed</span><span class="value" id="speedVal">100</span></div>
      <input type="range" id="speedSlider" min="10" max="300" value="100">
    </div>

    <div class="panel-head" style="margin-top:14px;">
      <div class="label">Soundtrack</div>
      <div id="soundStatus" style="font-size:11px; color:var(--ink-dim);">no track loaded</div>
    </div>
    <div style="display:flex; gap:8px; margin-bottom:8px;">
      <button id="loadFileBtn" style="flex:1;">Choose file</button>
      <button id="playBtn" style="flex:1;" disabled>▶ Play</button>
      <button id="reactiveBtn" style="flex:1;" disabled>✦ React: off</button>
    </div>
    <div style="display:flex; gap:8px; margin-bottom:8px;">
      <input type="text" id="trackUrlInput" placeholder="Paste GitHub raw audio URL…"
        value="https://github.com/MyMan577/Game-audio/blob/main/Living%20Dreams.mp3"
        style="flex:1; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.15);
               border-radius:8px; color:var(--ink); font-size:12px; padding:6px 10px;">
      <button id="loadUrlBtn">Load</button>
    </div>
    <input type="file" id="audioFileInput" accept="audio/*,video/mp4,.mp4,.m4a" style="display:none;">
    <div class="slider-row"><span class="label">Volume</span><span class="value" id="volumeVal">70</span></div>
    <input type="range" id="volumeSlider" min="0" max="100" value="70">
    <div id="playlist" style="display:flex; flex-direction:column; gap:6px; margin-top:10px;"></div>
  </div>
</div>

<button id="showDockBtn" aria-label="Show controls">⌃</button>

<script>
(function () {
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d', { alpha: false });
  let W, H, DPR;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 300));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) resize(); });
  resize();
  // When launched from the home screen, the browser chrome can still be
  // settling into place after this first paint, so window.innerWidth/Height
  // may briefly report a stale, smaller size. Re-measure a couple more times
  // shortly after load to catch that.
  setTimeout(resize, 100);
  setTimeout(resize, 500);

  // ---------- Palettes ----------
  const PALETTES = {
    neon:    { name: 'Neon',    bg: '#05050a', colors: ['#7df9ff', '#ff5fd8', '#8b5cff', '#5fffb0'] },
    crystal: { name: 'Crystal', bg: '#04060c', colors: ['#bfe9ff', '#8fd3ff', '#ffffff', '#6fb8ff'] },
    nature:  { name: 'Nature',  bg: '#050a06', colors: ['#8dffb0', '#ffe27a', '#6fff8f', '#c8ff6f'] },
    ember:   { name: 'Ember',   bg: '#0a0503', colors: ['#ff9d5c', '#ff5c5c', '#ffd15c', '#ff7ab0'] }
  };
  let paletteKey = 'neon';

  // ---------- Interaction modes ----------
  // These describe HOW touch pushes the always-on field of particles around,
  // not spawn effects — the particle count never changes when you touch.
  const MODES = ['Swirl', 'Repel', 'Attract', 'Orbit', 'Wind', 'Gravity Well', 'Comet'];
  let mode = 'Swirl';

  // ---------- Params ----------
  let targetCount = 250;  // desired number of particles on screen — set by slider
  let trailAmt = 45;      // 0-95 -> alpha of fade rect, controls trail length
  let sizeScale = 1;      // multiplier applied to every particle's radius
  let dragCoef = 0.999 - (34 / 100) * 0.099; // friction -> per-frame velocity retention
  let simSpeed = 1;      // multiplier applied to dt each frame — controls overall sim pace

  // ---------- Particle store (persistent field) ----------
  const MAX_PARTICLES = 1400;
  let particles = [];

  function rand(a, b) { return a + Math.random() * (b - a); }
  function pickColor() {
    const c = PALETTES[paletteKey].colors;
    return c[(Math.random() * c.length) | 0];
  }

  function makeParticle(x, y) {
    const a = rand(0, Math.PI * 2);
    const speed = rand(0.15, 0.5);
    const g = rand(0.7, 1.15);
    return {
      x: x !== undefined ? x : rand(0, W),
      y: y !== undefined ? y : rand(0, H),
      vx: Math.cos(a) * speed,
      vy: Math.sin(a) * speed,
      size: rand(1.4, 3.6),
      color: pickColor(),
      glow: g,
      baseGlow: g, // resting brightness — Comet mode boosts glow above this, then it decays back
      wobble: rand(0, Math.PI * 2),
      // spreads particles across a band of rings/orbits instead of all
      // converging onto one exact radius — keeps Orbit-family modes
      // visually alive instead of settling into a static, packed ring
      orbitJitter: rand(0.55, 1.6),
      spinJitter: rand(0.75, 1.3),
      teleportCooldown: 0, // frames left before this particle is allowed to hand off again
      // which role this particle plays in a two-finger Gravity Well bridge:
      // most particles coil around the line between the two wells, a
      // minority thread straight down the line itself
      strand: rand(0, 1) < 0.22 ? 'line' : 'coil',
      coilPhase: rand(0, Math.PI * 2), // offsets each coiling particle so they don't all swirl in lockstep
      coilSide: rand(0, 1) < 0.5 ? 1 : -1, // which side of the line this particle's strand winds on
      webOffset: rand(-22, 22) // perpendicular resting distance from a polygon edge for Attract/Wind's multi-finger web, so particles form a loose band instead of collapsing onto a single pixel-thin line
    };
  }

  // Smoothly grow or shrink the population toward targetCount.
  // Particles are permanent members of the field — they drift and get
  // pushed around, but they don't expire or get consumed by effects.
  function reconcilePopulation() {
    // step scales with how far we are from the target so huge jumps (e.g.
    // toward the new 10000 cap) settle in a couple seconds, not a minute.
    const step = Math.max(6, Math.ceil(Math.abs(targetCount - particles.length) / 30));
    if (particles.length < targetCount) {
      for (let i = 0; i < step && particles.length < targetCount; i++) {
        particles.push(makeParticle());
      }
    } else if (particles.length > targetCount) {
      particles.splice(0, Math.min(step, particles.length - targetCount));
    }
  }

  // ---------- Pointer tracking (multi-touch) ----------
  const pointers = new Map(); // id -> {x,y,px,py,angle,vx,vy}

  function updatePointer(id, x, y) {
    let p = pointers.get(id);
    if (!p) {
      p = { x, y, px: x, py: y, vx: 0, vy: 0, angle: rand(0, Math.PI * 2), t: 0 };
      pointers.set(id, p);
    } else {
      p.px = p.x; p.py = p.y;
      p.x = x; p.y = y;
      p.vx = p.x - p.px;
      p.vy = p.y - p.py;
    }
  }
  function removePointer(id) { pointers.delete(id); }

  const RELEASE_STRENGTH = 6.5;
  const RELEASE_STRENGTH_BY_MODE = { Attract: 10, Orbit: 10.5, 'Gravity Well': 11 };

  // When a finger lifts, every particle gets a burst kick — the direction
  // depends on the active mode, not just "away from the touch point":
  //   Attract -> bursts outward from the clump's own center, blended with
  //              a jittered version of each particle's existing heading —
  //              a tightly packed group scatters apart instead of all
  //              drifting off together in the same direction
  //   Repel   -> radial burst away from the release point
  //   Swirl   -> tangential burst, continuing the spin direction
  //   Orbit   -> strong radial burst off the ring, with a little spin left
  //              over, like flinging off a carousel that's spinning apart
  //   Wind    -> burst along the direction the finger was last moving
  //   Gravity Well -> outward from the pack's own center, like Attract
  //   Comet   -> continues the trailing/repel behavior from the drag
  function releaseBurst(id) {
    const p = pointers.get(id);
    if (!p) return;

    // center of the current field — used so Attract/Orbit bursts scatter
    // outward from where the particles actually are, not just the touch
    let sumX = 0, sumY = 0;
    particles.forEach(pt => { sumX += pt.x; sumY += pt.y; });
    const centroidX = sumX / Math.max(1, particles.length);
    const centroidY = sumY / Math.max(1, particles.length);

    particles.forEach((pt) => {
      const dx = pt.x - p.x, dy = pt.y - p.y;
      const dist = Math.max(6, Math.hypot(dx, dy));
      const falloff = FALLOFF_REACH / (FALLOFF_REACH + dist);
      const nx = dx / dist, ny = dy / dist;
      const strength = RELEASE_STRENGTH_BY_MODE[mode] || RELEASE_STRENGTH;
      const kick = strength * falloff;

      switch (mode) {
        case 'Attract': {
          // outward from the pack's own center, not the touch point —
          // this is what actually separates particles that were moving
          // in lockstep, since their positions still differ even when
          // their velocities look identical
          const cdx = pt.x - centroidX, cdy = pt.y - centroidY;
          const cdist = Math.max(4, Math.hypot(cdx, cdy));
          const cnx = cdx / cdist, cny = cdy / cdist;

          const sp = Math.hypot(pt.vx, pt.vy);
          const headingAngle = sp > 0.01 ? Math.atan2(pt.vy, pt.vx) : Math.atan2(cny, cnx);
          const jitter = rand(-0.55, 0.55); // breaks up any uniform direction
          const burstAngle = headingAngle + jitter;

          pt.vx += Math.cos(burstAngle) * kick * 0.7 + cnx * kick * 0.9;
          pt.vy += Math.sin(burstAngle) * kick * 0.7 + cny * kick * 0.9;
          break;
        }
        case 'Repel': {
          pt.vx += nx * kick;
          pt.vy += ny * kick;
          break;
        }
        case 'Swirl': {
          pt.vx += -ny * kick;
          pt.vy += nx * kick;
          break;
        }
        case 'Orbit': {
          // strong radial burst off the ring, plus a jittered angle so
          // the whole ring doesn't fly apart as one rigid disc
          const jitter = rand(-0.5, 0.5);
          const burstAngle = Math.atan2(ny, nx) + jitter;
          pt.vx += Math.cos(burstAngle) * kick * 1.3;
          pt.vy += Math.sin(burstAngle) * kick * 1.3;
          // a little leftover spin so it reads as flying off a carousel
          pt.vx += -ny * kick * 0.35;
          pt.vy += nx * kick * 0.35;
          break;
        }
        case 'Wind': {
          const wsp = Math.hypot(p.vx, p.vy);
          if (wsp > 0.01) {
            pt.vx += (p.vx / wsp) * kick;
            pt.vy += (p.vy / wsp) * kick;
          }
          break;
        }
        case 'Gravity Well': {
          // same idea as Attract's burst — scatter outward from the pack's
          // own center so a tightly collapsed clump explodes apart rather
          // than drifting off as one rigid group
          const cdx = pt.x - centroidX, cdy = pt.y - centroidY;
          const cdist = Math.max(4, Math.hypot(cdx, cdy));
          const cnx = cdx / cdist, cny = cdy / cdist;
          pt.vx += cnx * kick;
          pt.vy += cny * kick;
          break;
        }
        case 'Comet': {
          // release continues whatever the drag was doing: trailing
          // particles keep being flung backward away from the motion,
          // or if the finger was held still, they get one last outward push
          const wsp = Math.hypot(p.vx, p.vy);
          if (dist < COMET_RADIUS * 1.5) {
            if (wsp > COMET_DRAG_THRESHOLD) {
              pt.vx -= (p.vx / wsp) * kick * 1.4;
              pt.vy -= (p.vy / wsp) * kick * 1.4;
            } else {
              pt.vx += nx * kick * 1.2;
              pt.vy += ny * kick * 1.2;
            }
            pt.glow = Math.min(2.2, pt.glow + 0.6);
          }
          break;
        }
      }
    });
  }

  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    updatePointer(e.pointerId, e.clientX, e.clientY);
    document.getElementById('hint').classList.add('hidden');
  });
  canvas.addEventListener('pointermove', (e) => {
    if (pointers.has(e.pointerId)) updatePointer(e.pointerId, e.clientX, e.clientY);
  });
  canvas.addEventListener('pointerup', (e) => {
    releaseBurst(e.pointerId);
    removePointer(e.pointerId);
  });
  canvas.addEventListener('pointercancel', (e) => {
    releaseBurst(e.pointerId);
    removePointer(e.pointerId);
  });

  // A gentle random kick applied to the existing field — never changes count.
  function scatterField() {
    particles.forEach((pt) => {
      const a = rand(0, Math.PI * 2);
      const kick = rand(1.5, 4);
      pt.vx += Math.cos(a) * kick;
      pt.vy += Math.sin(a) * kick;
    });
  }

  // How quickly the pull weakens with distance — no cutoff, so every
  // particle on screen is always influenced by every touch, just more
  // gently the farther away it is. Orbit uses a tighter reach so its
  // pull stays local instead of dragging the whole screen into a slow spin.
  const FALLOFF_REACH = 260;
  const REACH_BY_MODE = { Swirl: 260, Repel: 260, Attract: 260, Orbit: 190, Wind: 260, 'Gravity Well': 240, Comet: 260 };

  // Orbit settles particles onto a ring at this radius around the touch,
  // like a small gravity well, instead of a wide diffuse swirl.
  const ORBIT_RADIUS = 55;
  const ORBIT_SPRING = 0.05;
  const ORBIT_SPIN = 1.5;

  // Comet only sweeps up particles that stray very close to the finger —
  // everything outside this radius gets just a faint drift toward it,
  // so the effect reads as a few bright streaks rather than a full field push.
  const COMET_RADIUS = 70;

  // How fast the finger has to be moving (in px/frame) before Comet treats
  // it as a "drag" rather than "held still". Raised well above raw jitter
  // noise so a finger resting in one spot doesn't flicker between the
  // explode and trailing behaviors from sub-pixel tremor alone.
  const COMET_DRAG_THRESHOLD = 0.6;

  // Apply the active interaction mode's force from every active touch
  // to a single particle. This is the ONLY way touch affects the field —
  // it steers particles that already exist, it never creates or destroys them.
  // Every particle is always in range; nothing is ever excluded by distance.
  // `activePointers` is a plain array built once per frame (see frame()) —
  // iterating it with a for-loop instead of calling pointers.forEach(...)
  // here avoids allocating a brand new closure for every one of the
  // thousands of particles on every single frame, which is what was
  // actually causing the stutter at high particle counts.
  function applyTouchForces(pt, dt, activePointers, polygon) {
    // With 3+ fingers down, each pointer's individual pull below still
    // fires for every finger on every particle — that's what makes 2-finger
    // combos feel powerful, but left unscaled it means a "pull toward a
    // point" force (Attract, Orbit's ring spring, Wind's push) effectively
    // gets applied once per finger and stacks linearly, so 5 fingers pull
    // ~5x harder than 2 and collapse the field into a dense clump instead
    // of spreading it out. Tame just those spring-like forces down as more
    // fingers join; 1-2 fingers are untouched (scale stays 1) since that
    // behavior already works well.
    const pointerScale = activePointers.length > 2 ? Math.min(1, 2 / activePointers.length) : 1;

    for (let pi = 0; pi < activePointers.length; pi++) {
      const p = activePointers[pi];
      const dx = pt.x - p.x, dy = pt.y - p.y;
      const dist = Math.max(6, Math.hypot(dx, dy));
      const reach = REACH_BY_MODE[mode] || FALLOFF_REACH;
      const falloff = reach / (reach + dist); // never reaches zero
      const nx = dx / dist, ny = dy / dist;

      switch (mode) {
        case 'Swirl': {
          // tangential force, like stirring a fluid. With 3+ fingers,
          // alternate spin direction finger-to-finger (even index CW, odd
          // index CCW) instead of everything spinning the same way — this
          // is what gives Swirl its own identity as turbulence (eddies
          // fighting each other) rather than Orbit's clean single rotation.
          const spinSign = activePointers.length >= 3 && (pi % 2 === 1) ? -1 : 1;
          pt.vx += -ny * falloff * 0.9 * dt * spinSign;
          pt.vy += nx * falloff * 0.9 * dt * spinSign;
          pt.vx += p.vx * falloff * 0.12 * dt;
          pt.vy += p.vy * falloff * 0.12 * dt;
          break;
        }
        case 'Repel': {
          // push outward, strongest close to the finger, falling off fast —
          // combined with edge containment this builds a dense pressure
          // ring instead of just draining particles to the border
          pt.vx += nx * falloff * falloff * 2.4 * dt;
          pt.vy += ny * falloff * falloff * 2.4 * dt;
          break;
        }
        case 'Attract': {
          pt.vx -= nx * falloff * 0.7 * dt * pointerScale;
          pt.vy -= ny * falloff * 0.7 * dt * pointerScale;
          break;
        }
        case 'Orbit': {
          // Each particle targets its own ring radius (varied by orbitJitter)
          // that also breathes slowly over time via its wobble phase, and
          // spins at its own slightly-different rate (spinJitter). Without
          // this every particle would converge onto the exact same radius
          // at the exact same phase and just look like a static, packed
          // ring — varying it keeps the whole halo visibly alive and in
          // motion instead of settling into one "final" frozen shape.
          const targetRadius = ORBIT_RADIUS * pt.orbitJitter * (1 + 0.18 * Math.sin(pt.wobble * 0.6));
          const springForce = (dist - targetRadius) * ORBIT_SPRING;
          pt.vx -= nx * springForce * dt * pointerScale;
          pt.vy -= ny * springForce * dt * pointerScale;
          // spin is rotational, not a pull toward a point, so it doesn't
          // stack into a clump the way the radial spring does — left
          // unscaled so the rings still visibly spin with more fingers down
          pt.vx += -ny * ORBIT_SPIN * pt.spinJitter * falloff * dt;
          pt.vy += nx * ORBIT_SPIN * pt.spinJitter * falloff * dt;
          break;
        }
        case 'Wind': {
          // pushes everything nearby in the direction the finger is moving
          pt.vx += p.vx * falloff * 0.6 * dt * pointerScale;
          pt.vy += p.vy * falloff * 0.6 * dt * pointerScale;
          break;
        }
        case 'Gravity Well': {
          // inverse-square-ish pull — weak from far away, but it ramps up
          // sharply as particles close in, so instead of settling calmly
          // like Attract, fast-moving particles sling past the center and
          // get pulled back around, overshooting again and again
          const g = Math.min(90, (reach * reach) / (dist * dist));
          pt.vx -= nx * g * 0.016 * dt;
          pt.vy -= ny * g * 0.016 * dt;
          break;
        }
        case 'Comet': {
          // only particles inside the tight comet radius get swept up.
          // Held still, the finger acts like a shockwave and pushes them
          // outward; dragged, it acts like a tail being dragged through
          // the field — particles get shoved backward, opposite the
          // direction of motion, so they trail behind instead of chasing
          // it. Nothing outside the radius is pulled in — it just gets a
          // faint outward nudge so the mode never sucks particles toward
          // the finger, only ever blows them away.
          if (dist < COMET_RADIUS) {
            const near = 1 - dist / COMET_RADIUS;
            const wsp = Math.hypot(p.vx, p.vy);
            if (wsp > COMET_DRAG_THRESHOLD) {
              pt.vx -= (p.vx / wsp) * near * near * 5.5 * dt;
              pt.vy -= (p.vy / wsp) * near * near * 5.5 * dt;
            } else {
              pt.vx += nx * near * near * 4.5 * dt;
              pt.vy += ny * near * near * 4.5 * dt;
            }
            pt.glow = Math.min(2.2, pt.glow + near * 0.1 * dt);
          } else {
            pt.vx += nx * falloff * 0.05 * dt;
            pt.vy += ny * falloff * 0.05 * dt;
          }
          break;
        }
      }
    }

    // Two-finger combos — an extra force layered on top of each finger's
    // individual pull, computed once using both touch points together.
    // Every mode gets its own combo so a second finger genuinely changes
    // the shape of the effect rather than just adding a second copy of it.
    if (activePointers.length === 2) {
      applyComboForce(pt, dt, activePointers[0], activePointers[1]);
    } else if (activePointers.length >= 3) {
      // 3+ finger combos — the touches now define a polygon instead of a
      // single line, so the "extra" behavior layered on top is shape-based:
      // a ring for Gravity Well, a cage for Repel, a shared rotation for
      // Swirl/Orbit around the centroid of every active touch.
      applyMultiForce(pt, dt, activePointers, polygon);
    }
  }

  // Keeps two-finger Attract / Gravity Well alive instead of dying out once
  // particles clump onto one of the two fingers. Once a particle has settled
  // right on top of a finger it has nowhere left to go — this quietly moves
  // it just past the *other* finger and aims it back across the midpoint
  // toward the first, so it keeps sweeping the whole gap between the two
  // touches rather than sitting in a dead pile at either end.
  const HANDOFF_RADIUS = 16; // how "clumped onto a finger" has to look before it hands off
  const HANDOFF_COOLDOWN = 45; // frames before a particle is eligible to hand off again
  function handoffTeleport(pt, dt, p1, p2) {
    if (pt.teleportCooldown > 0) { pt.teleportCooldown -= dt; return; }

    const d1 = Math.hypot(pt.x - p1.x, pt.y - p1.y);
    const d2 = Math.hypot(pt.x - p2.x, pt.y - p2.y);
    let from = null, to = null;
    if (d1 < HANDOFF_RADIUS) { from = p1; to = p2; }
    else if (d2 < HANDOFF_RADIUS) { from = p2; to = p1; }
    if (!from) return;

    // land just beyond the target finger, on the far side away from "from" —
    // so the particle's very next step re-enters the segment between the
    // two fingers and has to cross the midpoint to reach "from" again
    const dx = to.x - from.x, dy = to.y - from.y;
    const dist = Math.max(1, Math.hypot(dx, dy));
    const ux = dx / dist, uy = dy / dist; // unit vector from -> to

    const overshoot = rand(HANDOFF_RADIUS * 1.1, HANDOFF_RADIUS * 1.8);
    const jitter = rand(-10, 10);
    pt.x = to.x + ux * overshoot + -uy * jitter;
    pt.y = to.y + uy * overshoot + ux * jitter;

    // velocity aimed back along the line toward "from", so it immediately
    // starts traversing the midpoint instead of pausing at the new well
    const speed = rand(1.6, 2.6);
    pt.vx = -ux * speed;
    pt.vy = -uy * speed;
    pt.glow = Math.min(2.2, pt.glow + 0.5);

    pt.teleportCooldown = HANDOFF_COOLDOWN + rand(-10, 10);
  }

  function applyComboForce(pt, dt, p1, p2) {
    const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
    const segDx = p2.x - p1.x, segDy = p2.y - p1.y;
    const segLen = Math.max(1, Math.hypot(segDx, segDy));
    const ux = segDx / segLen, uy = segDy / segLen; // unit vector along the line between the two fingers

    // closest point on the finger-to-finger segment, clamped to its ends
    const t = Math.max(0, Math.min(1, ((pt.x - p1.x) * ux + (pt.y - p1.y) * uy) / segLen));
    const closestX = p1.x + ux * segLen * t, closestY = p1.y + uy * segLen * t;
    const pdx = pt.x - closestX, pdy = pt.y - closestY;
    const pdist = Math.max(6, Math.hypot(pdx, pdy));
    const pnx = pdx / pdist, pny = pdy / pdist; // perpendicular direction away from the line

    const reach = REACH_BY_MODE[mode] || FALLOFF_REACH;
    const falloff = reach / (reach + pdist);

    switch (mode) {
      case 'Swirl': {
        // binary vortex — particles orbit the shared midpoint of both
        // fingers instead of circling each fingertip on its own
        const mdx = pt.x - mx, mdy = pt.y - my;
        const mdist = Math.max(6, Math.hypot(mdx, mdy));
        const mnx = mdx / mdist, mny = mdy / mdist;
        const mfall = reach / (reach + mdist);
        pt.vx += -mny * mfall * 0.55 * pt.spinJitter * dt;
        pt.vy += mnx * mfall * 0.55 * pt.spinJitter * dt;
        break;
      }
      case 'Repel': {
        // pressure wall — pushed away from the line connecting the two
        // fingers rather than two separate circular repel zones
        pt.vx += pnx * falloff * falloff * 2.0 * dt;
        pt.vy += pny * falloff * falloff * 2.0 * dt;
        break;
      }
      case 'Attract': {
        // bridge — pulled toward the nearest point on the line, so
        // particles between the two fingers stretch into a taut strand
        pt.vx -= pnx * falloff * 0.9 * dt;
        pt.vy -= pny * falloff * 0.9 * dt;
        handoffTeleport(pt, dt, p1, p2);
        break;
      }
      case 'Orbit': {
        // binary star — the two orbit rings slowly revolve around their
        // shared midpoint, on top of each particle circling its own ring
        const mdx = pt.x - mx, mdy = pt.y - my;
        const mdist = Math.max(6, Math.hypot(mdx, mdy));
        const mnx = mdx / mdist, mny = mdy / mdist;
        const mfall = reach / (reach + mdist);
        pt.vx += -mny * mfall * 0.35 * pt.spinJitter * dt;
        pt.vy += mnx * mfall * 0.35 * pt.spinJitter * dt;
        break;
      }
      case 'Wind': {
        // funnel — drawn onto the line between the fingers, then swept
        // along it, like wind being channeled through a corridor
        pt.vx -= pnx * falloff * 0.5 * dt;
        pt.vy -= pny * falloff * 0.5 * dt;
        pt.vx += ux * falloff * 0.4 * dt;
        pt.vy += uy * falloff * 0.4 * dt;
        break;
      }
      case 'Gravity Well': {
        // twin-strand bridge — a minority of particles ('line') get pulled
        // hard onto the exact segment between the two wells, forming a taut
        // bright core. Everyone else ('coil') gets pulled toward a target
        // offset from that line that winds sinusoidally along its length
        // and drifts over time, so they wrap around the core like a coil
        // instead of just orbiting whichever well is nearer.
        if (pt.strand === 'line') {
          pt.vx -= pnx * falloff * falloff * 2.6 * dt;
          pt.vy -= pny * falloff * falloff * 2.6 * dt;
        } else {
          const COIL_AMPLITUDE = 34;
          const COIL_FREQ = 5.5; // winds per full finger-to-finger span
          const coilTarget = pt.coilSide * COIL_AMPLITUDE *
            Math.sin(t * Math.PI * COIL_FREQ + pt.coilPhase + pt.wobble * 0.5);
          // signed perpendicular distance from the line: positive on the
          // pnx/pny side, negative on the other — lets coilTarget swing
          // particles across both sides of the line as t sweeps along it
          const signedDist = pdx * pnx + pdy * pny;
          const springForce = (signedDist - coilTarget) * 0.05;
          pt.vx -= pnx * springForce * dt;
          pt.vy -= pny * springForce * dt;
          // gentle pull along the line so coil particles stay strung
          // between the two wells rather than drifting off past either end
          pt.vx += ux * falloff * falloff * 0.5 * dt * (t < 0.5 ? 1 : -1);
          pt.vy += uy * falloff * falloff * 0.5 * dt * (t < 0.5 ? 1 : -1);
        }
        handoffTeleport(pt, dt, p1, p2);
        break;
      }
      case 'Comet': {
        // crossfire — particles caught inside both comet radii at once
        // get flung sideways off the line, like two streams colliding
        const d1 = Math.hypot(pt.x - p1.x, pt.y - p1.y);
        const d2 = Math.hypot(pt.x - p2.x, pt.y - p2.y);
        if (d1 < COMET_RADIUS && d2 < COMET_RADIUS) {
          pt.vx += pnx * 6 * dt;
          pt.vy += pny * 6 * dt;
          pt.glow = Math.min(2.2, pt.glow + 0.15 * dt);
        }
        break;
      }
    }
  }

  // ---------- 3+ finger combos ----------
  // With 3+ touches down, the fingers stop describing a single line and
  // start describing a polygon. buildPolygon() orders the raw touch points
  // by angle around their shared centroid (so the edges trace a simple,
  // non-self-intersecting loop even if the fingers were placed or listed
  // out of order) and precomputes each edge's direction, outward normal,
  // and position along the total perimeter. This runs once per frame in
  // frame(), NOT once per particle — with up to 5 points the sort is
  // trivial, but doing it 10,000+ times a frame would not be.
  function buildPolygon(points) {
    const n = points.length;
    let cx = 0, cy = 0;
    for (let i = 0; i < n; i++) { cx += points[i].x; cy += points[i].y; }
    cx /= n; cy /= n;

    const ordered = points.slice().sort((a, b) =>
      Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx));

    const edges = [];
    let perimeter = 0;
    for (let i = 0; i < n; i++) {
      const p1 = ordered[i], p2 = ordered[(i + 1) % n];
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const segLen = Math.max(1, Math.hypot(dx, dy));
      const ux = dx / segLen, uy = dy / segLen;
      // outward normal — start with one perpendicular candidate, flip it
      // if it happens to point back toward the centroid instead of away
      let nx = -uy, ny = ux;
      const midX = (p1.x + p2.x) / 2, midY = (p1.y + p2.y) / 2;
      if ((midX - cx) * nx + (midY - cy) * ny < 0) { nx = -nx; ny = -ny; }
      edges.push({ p1, p2, ux, uy, nx, ny, segLen, perimStart: perimeter });
      perimeter += segLen;
    }

    // shared "spin" of the whole touch cluster — average tangential
    // velocity of every finger relative to the centroid. Used by Wind's
    // multi-finger cyclone: dragging fingers around each other (rather
    // than straight-line dragging) builds up a shared rotation.
    let spin = 0;
    for (let i = 0; i < n; i++) {
      const p = points[i];
      const dx = p.x - cx, dy = p.y - cy;
      const dist = Math.max(1, Math.hypot(dx, dy));
      const tx = -dy / dist, ty = dx / dist;
      spin += (p.vx || 0) * tx + (p.vy || 0) * ty;
    }
    spin /= n;

    return { cx, cy, edges, perimeter, points: ordered, spin };
  }

  // Finds the nearest polygon edge to a particle, and where along that
  // edge (t, clamped to the segment) the closest point sits. Shared by
  // every multi-finger mode that pulls particles toward the shape's
  // boundary (Attract, Wind, Gravity Well, Repel), computed fresh per
  // particle since the closest edge differs particle to particle, but the
  // polygon itself (edges, ordering, centroid) is only built once per frame.
  function nearestEdgeInfo(pt, polygon) {
    let best = null, bestDist = Infinity, bestT = 0;
    for (let i = 0; i < polygon.edges.length; i++) {
      const e = polygon.edges[i];
      const t = Math.max(0, Math.min(1, ((pt.x - e.p1.x) * e.ux + (pt.y - e.p1.y) * e.uy) / e.segLen));
      const cx2 = e.p1.x + e.ux * e.segLen * t, cy2 = e.p1.y + e.uy * e.segLen * t;
      const d = Math.hypot(pt.x - cx2, pt.y - cy2);
      if (d < bestDist) { bestDist = d; best = e; bestT = t; }
    }
    return { edge: best, dist: bestDist, t: bestT };
  }

  // Standard ray-casting point-in-polygon test, used by Repel's cage.
  function pointInPolygon(x, y, ordered) {
    let inside = false;
    for (let i = 0, j = ordered.length - 1; i < ordered.length; j = i++) {
      const xi = ordered[i].x, yi = ordered[i].y;
      const xj = ordered[j].x, yj = ordered[j].y;
      const intersect = ((yi > y) !== (yj > y)) &&
        (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  // Generalized version of handoffTeleport for 3+ fingers: instead of
  // bouncing between exactly two wells, a particle that clumps onto any
  // vertex hops to the NEXT vertex around the ring and keeps its velocity
  // pointed the same way it was already traveling around the loop — so
  // with N fingers down, particles keep circulating the whole ring instead
  // of pooling at one corner. (With exactly 2 points this degenerates into
  // the same back-and-forth as the two-finger version.)
  function handoffTeleportPolygon(pt, dt, polygon) {
    if (pt.teleportCooldown > 0) { pt.teleportCooldown -= dt; return; }

    const pts = polygon.points;
    let nearestIdx = -1, nearestDist = HANDOFF_RADIUS;
    for (let i = 0; i < pts.length; i++) {
      const d = Math.hypot(pt.x - pts[i].x, pt.y - pts[i].y);
      if (d < nearestDist) { nearestDist = d; nearestIdx = i; }
    }
    if (nearestIdx === -1) return;

    const from = pts[nearestIdx];
    const to = pts[(nearestIdx + 1) % pts.length]; // always advance forward around the ring
    const dx = to.x - from.x, dy = to.y - from.y;
    const dist = Math.max(1, Math.hypot(dx, dy));
    const ux = dx / dist, uy = dy / dist;

    const overshoot = rand(HANDOFF_RADIUS * 1.1, HANDOFF_RADIUS * 1.8);
    const jitter = rand(-10, 10);
    pt.x = to.x + ux * overshoot + -uy * jitter;
    pt.y = to.y + uy * overshoot + ux * jitter;

    const speed = rand(1.6, 2.6);
    pt.vx = ux * speed; // keep moving FORWARD around the ring, toward the vertex after "to"
    pt.vy = uy * speed;
    pt.glow = Math.min(2.2, pt.glow + 0.5);

    pt.teleportCooldown = HANDOFF_COOLDOWN + rand(-10, 10);
  }

  function applyMultiForce(pt, dt, activePointers, polygon) {
    switch (mode) {
      case 'Swirl': {
        // Turbulence identity now lives in the per-pointer loop above
        // (alternating spin direction per finger); no extra shared-centroid
        // rotation here, so Swirl reads as fighting eddies rather than one
        // clean rotation — that's what separates it from Orbit below.
        break;
      }
      case 'Orbit': {
        // small star cluster — each finger still holds its own ring, and
        // the whole cluster of rings slowly revolves around their shared
        // centroid, same idea as the two-finger binary star, generalized.
        // Kept gentle since the per-finger ring springs above (now scaled
        // down by pointerScale as more fingers join) already do most of
        // the work — this is just the slow shared drift on top.
        const mdx = pt.x - polygon.cx, mdy = pt.y - polygon.cy;
        const mdist = Math.max(6, Math.hypot(mdx, mdy));
        const mnx = mdx / mdist, mny = mdy / mdist;
        const reach = REACH_BY_MODE.Orbit;
        const mfall = reach / (reach + mdist);
        pt.vx += -mny * mfall * 0.18 * pt.spinJitter * dt;
        pt.vy += mnx * mfall * 0.18 * pt.spinJitter * dt;
        break;
      }
      case 'Repel': {
        // cage — particles trapped inside the polygon get blown outward
        // through whichever edge is nearest, like pressure finding the
        // thinnest wall of a balloon. Particles already outside are left
        // to the normal per-finger repel from the loop above.
        if (!polygon || !pointInPolygon(pt.x, pt.y, polygon.points)) break;
        const info = nearestEdgeInfo(pt, polygon);
        if (info.edge) {
          pt.vx += info.edge.nx * 2.2 * dt;
          pt.vy += info.edge.ny * 2.2 * dt;
        }
        break;
      }
      case 'Attract': {
        // web — pulled toward the nearest edge of the polygon traced by
        // every active touch, so particles between any two neighboring
        // fingers stretch into a loose strand. Each particle springs
        // toward its own fixed perpendicular offset (webOffset) and a
        // fixed point along the edge's length (via coilPhase) instead of
        // a hard zero-distance target, so a whole crowd of particles
        // spreads into a soft band along the shape instead of collapsing
        // onto a single thin line or piling up at one spot on it.
        if (!polygon) break;
        const info = nearestEdgeInfo(pt, polygon);
        if (!info.edge) break;
        const e = info.edge;
        const closestX = e.p1.x + e.ux * e.segLen * info.t;
        const closestY = e.p1.y + e.uy * e.segLen * info.t;
        const pdx = pt.x - closestX, pdy = pt.y - closestY;
        const pdist = Math.max(6, info.dist);
        const pnx = pdx / pdist, pny = pdy / pdist;
        const reach = REACH_BY_MODE.Attract;
        const falloff = reach / (reach + pdist);

        const signedDist = pdx * pnx + pdy * pny;
        const springForce = (signedDist - pt.webOffset) * falloff * 0.35;
        pt.vx -= pnx * springForce * dt;
        pt.vy -= pny * springForce * dt;

        // gentle pull toward this particle's own fixed point along the
        // edge, so particles fan out along its length instead of bunching
        const targetT = 0.5 + 0.5 * Math.sin(pt.coilPhase);
        const tPull = (targetT - info.t) * falloff * 0.4;
        pt.vx += e.ux * tPull * dt;
        pt.vy += e.uy * tPull * dt;
        break;
      }
      case 'Wind': {
        // cyclone — pulled onto the nearest edge of the shape traced by
        // every finger and swept along it, same corridor idea as the
        // two-finger funnel but softened with the same per-particle
        // spread (webOffset / coilPhase) as multi-finger Attract, so the
        // corridor stays a wide band instead of collapsing into one dense
        // streak; on top of that the whole system picks up a shared spin
        // from how the fingers are moving relative to each other
        // (polygon.spin), so dragging fingers around one another builds
        // up a storm instead of just several separate corridors
        if (!polygon) break;
        const info = nearestEdgeInfo(pt, polygon);
        if (!info.edge) break;
        const e = info.edge;
        const closestX = e.p1.x + e.ux * e.segLen * info.t;
        const closestY = e.p1.y + e.uy * e.segLen * info.t;
        const pdx = pt.x - closestX, pdy = pt.y - closestY;
        const pdist = Math.max(6, info.dist);
        const pnx = pdx / pdist, pny = pdy / pdist;
        const reach = REACH_BY_MODE.Wind;
        const falloff = reach / (reach + pdist);

        const signedDist = pdx * pnx + pdy * pny;
        const springForce = (signedDist - pt.webOffset) * falloff * 0.18;
        pt.vx -= pnx * springForce * dt;
        pt.vy -= pny * springForce * dt;
        pt.vx += e.ux * falloff * 0.3 * dt;
        pt.vy += e.uy * falloff * 0.3 * dt;

        const mdx = pt.x - polygon.cx, mdy = pt.y - polygon.cy;
        const mdist = Math.max(6, Math.hypot(mdx, mdy));
        const mtx = -mdy / mdist, mty = mdx / mdist;
        const mfall = reach / (reach + mdist);
        pt.vx += mtx * polygon.spin * mfall * 0.35 * dt;
        pt.vy += mty * polygon.spin * mfall * 0.35 * dt;
        break;
      }
      case 'Comet': {
        // multi-crossfire — any pair of neighboring fingers that both
        // have this particle inside their comet radius flings it side-
        // ways off that edge, so 3+ fingers create several crossfire
        // seams around the shape instead of just one
        if (!polygon) break;
        for (let i = 0; i < polygon.edges.length; i++) {
          const e = polygon.edges[i];
          const d1 = Math.hypot(pt.x - e.p1.x, pt.y - e.p1.y);
          const d2 = Math.hypot(pt.x - e.p2.x, pt.y - e.p2.y);
          if (d1 < COMET_RADIUS && d2 < COMET_RADIUS) {
            pt.vx += e.nx * 6 * dt;
            pt.vy += e.ny * 6 * dt;
            pt.glow = Math.min(2.2, pt.glow + 0.15 * dt);
          }
        }
        break;
      }
      case 'Gravity Well': {
        // ring — a closed loop of wells instead of a single bridge. Same
        // line/coil roles as the two-finger version, but the coil's phase
        // is now driven by position along the WHOLE perimeter, so the
        // winding pattern is continuous all the way around the ring
        // instead of resetting at each edge, and handoffTeleportPolygon
        // keeps particles circulating the ring instead of pooling at
        // any one finger.
        if (!polygon) break;
        const info = nearestEdgeInfo(pt, polygon);
        if (!info.edge) break;
        const best = info.edge, bestT = info.t, bestDist = info.dist;

        const closestX = best.p1.x + best.ux * best.segLen * bestT;
        const closestY = best.p1.y + best.uy * best.segLen * bestT;
        const pdx = pt.x - closestX, pdy = pt.y - closestY;
        const pdist = Math.max(6, bestDist);
        const pnx = pdx / pdist, pny = pdy / pdist;
        const reach = REACH_BY_MODE['Gravity Well'];
        const falloff = reach / (reach + pdist);
        const globalT = (best.perimStart + bestT * best.segLen) / polygon.perimeter;

        if (pt.strand === 'line') {
          pt.vx -= pnx * falloff * falloff * 2.6 * dt;
          pt.vy -= pny * falloff * falloff * 2.6 * dt;
        } else {
          const COIL_AMPLITUDE = 34, COIL_FREQ = 5.5;
          const coilTarget = pt.coilSide * COIL_AMPLITUDE *
            Math.sin(globalT * Math.PI * 2 * COIL_FREQ + pt.coilPhase + pt.wobble * 0.5);
          const signedDist = pdx * pnx + pdy * pny;
          const springForce = (signedDist - coilTarget) * 0.05;
          pt.vx -= pnx * springForce * dt;
          pt.vy -= pny * springForce * dt;
          // gentle pull along the edge, keeping coil particles circulating
          // the ring instead of just sitting still perpendicular to it
          pt.vx += best.ux * falloff * falloff * 0.5 * dt;
          pt.vy += best.uy * falloff * falloff * 0.5 * dt;
        }
        handoffTeleportPolygon(pt, dt, polygon);
        break;
      }
    }
  }

  // ---------- Main loop ----------
  let last = performance.now();
  let lastRender = last;
  let fpsSmooth = 60;
  let fpsCap = false; // when true, throttle rendering to ~60fps regardless of display refresh rate
  const fpsEl = document.getElementById('fps');

  const MAX_SPEED = 13;
  const EMPTY_POINTERS = []; // reused when no touches are active, so we don't allocate a new empty array every frame

  function frame(now) {
    if (fpsCap && now - lastRender < 16.67) {
      // display can render faster than 60fps — skip this tick entirely so
      // we don't advance the sim or repaint, effectively capping at 60fps
      requestAnimationFrame(frame);
      return;
    }
    lastRender = now;

    const dt = Math.min(2, (now - last) / 16.67) * simSpeed;
    last = now;
    const audioEnergy = readAudioEnergy(now);
    // Audio only amplifies touch physics while reactivity is on, so normal play remains unchanged.
    const reactiveDt = dt * (1 + audioEnergy.mid * 0.35);
    fpsSmooth += ((1000 / Math.max(1, now - (frame._prev || now))) - fpsSmooth) * 0.05;
    frame._prev = now;

    reconcilePopulation();

    // Build the active-touch list once per frame, not once per particle —
    // this single array is reused by every particle's applyTouchForces call
    // below instead of each of them touching the Map individually.
    const activePointers = pointers.size ? Array.from(pointers.values()) : EMPTY_POINTERS;
    // With 3+ touches down, also build the shared polygon once per frame
    // (ordering + edges + centroid) rather than re-deriving it per particle.
    const polygon = activePointers.length >= 3 ? buildPolygon(activePointers) : null;

    // trail fade — repaint background at partial opacity instead of clearing,
    // which is what leaves the light trails behind each particle
    const bg = PALETTES[paletteKey].bg;
    ctx.globalCompositeOperation = 'source-over';
    // Treble leaves a little extra light behind, creating a gentle shimmer rather than a strobe.
    const fadeAlpha = Math.max(0.02, 1 - trailAmt / 100 * 0.9 - audioEnergy.high * 0.16);
    ctx.fillStyle = hexToRgba(bg, fadeAlpha);
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < particles.length; i++) {
      const pt = particles[i];

      // gentle ambient drift so the field is always alive, even untouched
      pt.wobble += 0.02 * dt;
      pt.vx += Math.cos(pt.wobble) * 0.008 * dt;
      pt.vy += Math.sin(pt.wobble * 0.8) * 0.008 * dt;

      applyTouchForces(pt, reactiveDt, activePointers, polygon);

      // Kick drums shove the whole field outward from wherever the shockwave
      // is centered — same falloff shape as Repel, just sourced from the
      // beat detector instead of a finger, and only live while a kick is
      // still ringing out (pulse decays to ~0 within a few frames).
      if (audioEnergy.kick > 0.015) {
        const kdx = pt.x - kickX, kdy = pt.y - kickY;
        const kdist = Math.max(6, Math.hypot(kdx, kdy));
        const kreach = Math.max(W, H) * 0.55;
        const kfalloff = kreach / (kreach + kdist);
        pt.vx += (kdx / kdist) * kfalloff * audioEnergy.kick * 6 * dt;
        pt.vy += (kdy / kdist) * kfalloff * audioEnergy.kick * 6 * dt;
      }

      // Snares/claps give every particle its own tiny random-direction
      // jolt rather than one shared shockwave — reads as a scatter/crackle
      // through the whole field instead of a directional push, which is
      // the right feel for a sharper, less bass-heavy hit.
      if (audioEnergy.snare > 0.02) {
        const sa = pt.wobble * 7.3 + pt.x * 0.013 + pt.y * 0.017; // cheap per-particle pseudo-random angle, no Math.random() per particle per frame
        pt.vx += Math.cos(sa) * audioEnergy.snare * 3.2 * dt;
        pt.vy += Math.sin(sa) * audioEnergy.snare * 3.2 * dt;
      }

      // speed cap so touch forces feel powerful but never chaotic
      const sp = Math.hypot(pt.vx, pt.vy);
      if (sp > MAX_SPEED) {
        pt.vx = (pt.vx / sp) * MAX_SPEED;
        pt.vy = (pt.vy / sp) * MAX_SPEED;
      }

      pt.vx *= Math.pow(dragCoef, dt);
      pt.vy *= Math.pow(dragCoef, dt);
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;

      // Particles are permanent — they never leave the field. While a
      // finger is down, anything that drifts off-screen reappears next
      // to that finger so it's immediately back in play. With no active
      // touch, it just wraps to the opposite edge like a normal scroller.
      // Wind always uses that same wrap-around scroll, even mid-touch,
      // since particles are meant to blow across and off the field rather
      // than recycle back around the finger.
      const offscreen = pt.x < -10 || pt.x > W + 10 || pt.y < -10 || pt.y > H + 10;
      if (offscreen) {
        if (pointers.size > 0 && mode !== 'Wind') {
          const touches = [...pointers.values()];
          const anchor = touches[(Math.random() * touches.length) | 0];
          const a = rand(0, Math.PI * 2);
          const r = rand(14, 46);
          pt.x = anchor.x + Math.cos(a) * r;
          pt.y = anchor.y + Math.sin(a) * r;
          pt.vx = Math.cos(a) * rand(0.4, 1.2);
          pt.vy = Math.sin(a) * rand(0.4, 1.2);
        } else {
          if (pt.x < -10) pt.x = W + 10;
          if (pt.x > W + 10) pt.x = -10;
          if (pt.y < -10) pt.y = H + 10;
          if (pt.y > H + 10) pt.y = -10;
        }
      }

      const twinkle = 0.85 + Math.sin(pt.wobble * 2.3) * 0.15;
      // Highs brighten the field; bass adds a smaller lift; a kick adds a
      // sharp extra flash on top so the hit reads instantly, before the
      // push has even had time to move anything. Hi-hats only touch glow
      // (never force/size) since they fire so often that anything stronger
      // would turn into constant noise instead of a shimmer.
      const reactiveGlow = audioEnergy.high * 0.95 + audioEnergy.bass * 0.22 + audioEnergy.kick * 0.6 + audioEnergy.hat * 0.35;
      const targetGlow = pt.baseGlow + reactiveGlow;
      pt.glow += (targetGlow - pt.glow) * 0.12 * dt;
      const alpha = 0.75 * pt.glow * twinkle;

      // globalAlpha + a plain hex fillStyle instead of building a fresh
      // rgba(...) string via hexToRgba every particle every frame — string
      // parsing/allocation there was a major source of GC pressure at
      // high particle counts, since it ran up to 10,000+ times per frame.
      ctx.globalAlpha = alpha;
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      // Bass gives every particle a restrained pulse, and a kick briefly pops it further.
      const reactiveSize = 1 + audioEnergy.bass * 0.38 + audioEnergy.kick * 0.3;
      ctx.arc(pt.x, pt.y, pt.size * sizeScale * reactiveSize, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    fpsEl.textContent = Math.round(fpsSmooth) + ' fps · ' + particles.length + ' particles';

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function hexToRgba(hex, a) {
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
    const r = parseInt(hex.slice(0, 2), 16);
    const g = parseInt(hex.slice(2, 4), 16);
    const b = parseInt(hex.slice(4, 6), 16);
    return `rgba(${r},${g},${b},${a})`;
  }

  // ---------- UI wiring ----------
  const SETTINGS_KEY = 'nebulaSettings';
  function saveSettings() {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify({
      mode, paletteKey,
      density: targetCount, trail: trailAmt, size: Math.round(sizeScale * 100),
      friction: +frictionSlider.value, speed: +speedSlider.value,
      fpsCap, volume: Math.round(audioEl.volume * 100), audioReactive
    }));
  }

  const modeRow = document.getElementById('modeRow');
  const modeChips = {};
  MODES.forEach((m) => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (m === mode ? ' active' : '');
    chip.textContent = m;
    chip.addEventListener('click', () => {
      mode = m;
      [...modeRow.children].forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      saveSettings();
    });
    modeChips[m] = chip;
    modeRow.appendChild(chip);
  });

  const paletteRow = document.getElementById('paletteRow');
  const paletteSwatches = {};
  Object.keys(PALETTES).forEach((key) => {
    const sw = document.createElement('button');
    sw.className = 'swatch' + (key === paletteKey ? ' active' : '');
    const c = PALETTES[key].colors;
    sw.style.background = `linear-gradient(135deg, ${c[0]}, ${c[1]} 50%, ${c[2]})`;
    sw.innerHTML = `<span>${PALETTES[key].name}</span>`;
    sw.addEventListener('click', () => {
      paletteKey = key;
      [...paletteRow.children].forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      // recolor the existing field to match — particles stay, only their look changes
      particles.forEach(pt => { pt.color = pickColor(); });
      ctx.fillStyle = PALETTES[paletteKey].bg;
      ctx.fillRect(0, 0, W, H);
      saveSettings();
    });
    paletteSwatches[key] = sw;
    paletteRow.appendChild(sw);
  });

  // Particles slider sets how many live on screen at once — the field grows
  // or shrinks smoothly toward this number, it's never reset to zero.
  const densitySlider = document.getElementById('densitySlider');
  const densityVal = document.getElementById('densityVal');
  densitySlider.addEventListener('input', () => {
    targetCount = +densitySlider.value;
    densityVal.textContent = targetCount;
    saveSettings();
  });

  const trailSlider = document.getElementById('trailSlider');
  const trailVal = document.getElementById('trailVal');
  trailSlider.addEventListener('input', () => {
    trailAmt = +trailSlider.value;
    trailVal.textContent = trailAmt;
    saveSettings();
  });

  const sizeSlider = document.getElementById('sizeSlider');
  const sizeVal = document.getElementById('sizeVal');
  sizeSlider.addEventListener('input', () => {
    sizeScale = (+sizeSlider.value) / 100;
    sizeVal.textContent = sizeSlider.value;
    saveSettings();
  });

  const frictionSlider = document.getElementById('frictionSlider');
  const frictionVal = document.getElementById('frictionVal');
  frictionSlider.addEventListener('input', () => {
    const v = +frictionSlider.value;
    // higher slider value = more friction = particles shed speed faster
    dragCoef = 0.999 - (v / 100) * 0.099;
    frictionVal.textContent = v;
    saveSettings();
  });

  const speedSlider = document.getElementById('speedSlider');
  const speedVal = document.getElementById('speedVal');
  speedSlider.addEventListener('input', () => {
    const v = +speedSlider.value;
    simSpeed = v / 100;
    speedVal.textContent = v;
    saveSettings();
  });

  document.getElementById('clearBtn').addEventListener('click', scatterField);

  const fpsCapBtn = document.getElementById('fpsCapBtn');
  fpsCapBtn.addEventListener('click', () => {
    fpsCap = !fpsCap;
    fpsCapBtn.classList.toggle('active', fpsCap);
    fpsCapBtn.textContent = '60fps cap: ' + (fpsCap ? 'on' : 'off');
    saveSettings();
  });

  // Restore last-used settings, if any. Called after every control is
  // wired up so we can just set values + click the right chips/swatches
  // rather than duplicating each handler's logic.
  function restoreSettings() {
    let saved;
    try { saved = JSON.parse(localStorage.getItem(SETTINGS_KEY)); } catch { saved = null; }
    if (!saved) return;

    if (saved.mode && modeChips[saved.mode]) modeChips[saved.mode].click();
    if (saved.paletteKey && paletteSwatches[saved.paletteKey]) paletteSwatches[saved.paletteKey].click();

    if (typeof saved.density === 'number') { densitySlider.value = saved.density; densitySlider.dispatchEvent(new Event('input')); }
    if (typeof saved.trail === 'number') { trailSlider.value = saved.trail; trailSlider.dispatchEvent(new Event('input')); }
    if (typeof saved.size === 'number') { sizeSlider.value = saved.size; sizeSlider.dispatchEvent(new Event('input')); }
    if (typeof saved.friction === 'number') { frictionSlider.value = saved.friction; frictionSlider.dispatchEvent(new Event('input')); }
    if (typeof saved.speed === 'number') { speedSlider.value = saved.speed; speedSlider.dispatchEvent(new Event('input')); }
    if (saved.fpsCap && !fpsCap) fpsCapBtn.click();
    if (typeof saved.volume === 'number') { volumeSlider.value = saved.volume; volumeSlider.dispatchEvent(new Event('input')); }
    if (typeof saved.audioReactive === 'boolean') {
      audioReactive = saved.audioReactive;
      updateReactiveButton();
      // Restoring "on" only sets the flag — it doesn't rebuild the analyser
      // that got created (in the browser's memory, not saved state) last
      // session. Without this, the button reads "on" but nothing reacts
      // until it's manually toggled off and on again.
      if (audioReactive) ensureAudioAnalysis();
    }
  }

  // ---------- Soundtrack ----------
  // Two ways to bring in audio, neither of which embeds any audio data in
  // this file's source: (1) pick a local file — its bytes get saved into
  // IndexedDB so it's still there next time you open the page, or (2)
  // point at an already-hosted file (e.g. a raw GitHub URL), which just
  // gets remembered by name/URL since the browser can stream it fresh
  // each time. Both show up in the playlist below for instant reloading.
  const audioEl = new Audio();
  // Needed for browser-based analysis of eligible hosted audio sources.
  audioEl.crossOrigin = 'anonymous';
  audioEl.loop = true;
  audioEl.volume = 0.7;

  // Audio-reactive state. The browser creates this signal path only after a player action.
  let audioContext = null;
  let audioSource = null;
  let analyser = null;
  let frequencyData = null;
  let audioReactive = false;
  const audioLevels = { bass: 0, mid: 0, high: 0, kick: 0, snare: 0, hat: 0 };

  // A second analyser tapped off the same source, dedicated to beat
  // detection. It needs near-zero internal smoothing (Web Audio smooths
  // getByteFrequencyData for you before your code ever sees it) so a sudden
  // hit actually shows up as a spike instead of getting blurred into the
  // glow-friendly signal above.
  let beatAnalyser = null;
  let beatFrequencyData = null;
  let kickBinStart = 1, kickBinEnd = 4;     // ~40-200Hz, kick drum fundamental — recomputed once the real sample rate is known
  let snareBinStart = 4, snareBinEnd = 12;  // ~200-600Hz, snare/clap body
  let hatBinStart = 60, hatBinEnd = 160;    // ~2.5-7kHz, hi-hats/cymbals/other bright transients

  // ---- Onset (hit) detection ----
  // Same idea for all three bands: a hit fires when that band's energy
  // suddenly jumps well above its own recent rolling average. Each band
  // gets its own history buffer, cooldown, and pulse so a kick, snare, and
  // hi-hat can all fire independently (and even land on the same frame)
  // without interfering with each other.
  const BEAT_HISTORY_LEN = 40; // ~0.6-0.7s window at 60fps — long enough to average across a beat or two, short enough to track a track's actual loudness

  function makeOnsetTracker() {
    return { history: new Array(BEAT_HISTORY_LEN).fill(0), pos: 0, filled: 0, cooldownMs: 0, pulse: 0 };
  }
  const kickTracker = makeOnsetTracker();
  const snareTracker = makeOnsetTracker();
  const hatTracker = makeOnsetTracker();

  let kickX = 0, kickY = 0; // where the kick's shockwave currently radiates from
  let lastBeatCheckMs = null;

  function bandEnergy(start, end) {
    if (!beatFrequencyData) return 0;
    let total = 0, count = 0;
    for (let i = start; i < end; i++) { total += beatFrequencyData[i]; count++; }
    return count ? (total / count) / 255 : 0;
  }

  // thresholdMult/floor/minFill tuned per-instrument below; kicks and snares
  // are punchy and sparse so they can react fast and hit hard, hi-hats fire
  // far more often (every 8th note or faster) so they're tuned gentler and
  // with a shorter cooldown to avoid drowning everything else out.
  function detectOnset(tracker, raw, dtMs, thresholdMult, floor, cooldownMs, minFill) {
    tracker.cooldownMs = Math.max(0, tracker.cooldownMs - dtMs);
    tracker.pulse *= 0.86; // a hit is a punch, not a glow — fade it out fast

    const avg = tracker.history.reduce((a, b) => a + b, 0) / (tracker.filled || 1);
    tracker.history[tracker.pos] = raw;
    tracker.pos = (tracker.pos + 1) % BEAT_HISTORY_LEN;
    if (tracker.filled < BEAT_HISTORY_LEN) tracker.filled++;

    const threshold = Math.max(floor, avg * thresholdMult);
    if (raw > threshold && tracker.cooldownMs <= 0 && tracker.filled >= minFill) {
      tracker.pulse = Math.min(1, (raw - avg) * 2.6 + 0.45);
      tracker.cooldownMs = cooldownMs;
      return true;
    }
    return false;
  }

  function detectBeat(nowMs) {
    const dtMs = lastBeatCheckMs == null ? 16.67 : Math.min(100, nowMs - lastBeatCheckMs);
    lastBeatCheckMs = nowMs;

    beatAnalyser.getByteFrequencyData(beatFrequencyData);
    const kickRaw = bandEnergy(kickBinStart, kickBinEnd);
    const snareRaw = bandEnergy(snareBinStart, snareBinEnd);
    const hatRaw = bandEnergy(hatBinStart, hatBinEnd);

    // 1.22x its own recent average catches most kick drums; the flat 0.05
    // floor keeps quiet passages (near-silent average) from "beating" on noise.
    if (detectOnset(kickTracker, kickRaw, dtMs, 1.22, 0.05, 180, 8)) {
      // Shockwave radiates from wherever your fingers are (feels connected
      // to what you're doing); with no touch, from the field's center with
      // a little jitter so every kick doesn't blast from the exact same spot.
      if (pointers.size) {
        let sx = 0, sy = 0;
        for (const p of pointers.values()) { sx += p.x; sy += p.y; }
        kickX = sx / pointers.size; kickY = sy / pointers.size;
      } else {
        const jitter = Math.min(W, H) * 0.12;
        kickX = W / 2 + (Math.random() * 2 - 1) * jitter;
        kickY = H / 2 + (Math.random() * 2 - 1) * jitter;
      }
    }

    // Snares are usually a touch less peaky relative to their own average
    // than a clean kick, so a slightly lower multiplier keeps them from
    // getting missed; cooldown is a bit shorter since snares/claps can
    // land on quick fills.
    detectOnset(snareTracker, snareRaw, dtMs, 1.18, 0.04, 140, 8);

    // Hi-hats/cymbals fire far more often (every 8th note or faster), so
    // they're tuned to be forgiving but with a short cooldown and a fast
    // decay elsewhere — this should feel like a shimmer, not a shove.
    detectOnset(hatTracker, hatRaw, dtMs, 1.15, 0.035, 90, 8);
  }

  const soundStatus = document.getElementById('soundStatus');
  const playBtn = document.getElementById('playBtn');
  const reactiveBtn = document.getElementById('reactiveBtn');
  const loadFileBtn = document.getElementById('loadFileBtn');
  const audioFileInput = document.getElementById('audioFileInput');
  const trackUrlInput = document.getElementById('trackUrlInput');
  const loadUrlBtn = document.getElementById('loadUrlBtn');
  const volumeSlider = document.getElementById('volumeSlider');
  const volumeVal = document.getElementById('volumeVal');
  const playlistEl = document.getElementById('playlist');

  let currentObjectUrl = null;
  let activeTrackId = null;
  const PLAYLIST_KEY = 'nebulaPlaylist';

  function averageFrequencyRange(start, end) {
    if (!frequencyData || end <= start) return 0;
    let total = 0;
    for (let i = start; i < end; i++) total += frequencyData[i];
    return total / (end - start) / 255;
  }

  function ensureAudioAnalysis() {
    const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextCtor) return false;
    if (audioContext) return true;

    try {
      audioContext = new AudioContextCtor();
      audioSource = audioContext.createMediaElementSource(audioEl);
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 512;
      analyser.smoothingTimeConstant = 0.78;
      frequencyData = new Uint8Array(analyser.frequencyBinCount);

      // Separate tap for onset (hit) detection: barely any smoothing, so a
      // sudden hit actually shows up as a spike instead of getting blurred
      // into the glow-friendly signal above. Not connected onward to
      // destination — it doesn't need to be, it just listens to whatever
      // passes through it.
      beatAnalyser = audioContext.createAnalyser();
      beatAnalyser.fftSize = 1024;
      beatAnalyser.smoothingTimeConstant = 0.15;
      beatFrequencyData = new Uint8Array(beatAnalyser.frequencyBinCount);
      const binHz = audioContext.sampleRate / beatAnalyser.fftSize;
      kickBinStart = Math.max(1, Math.round(40 / binHz));
      kickBinEnd = Math.max(kickBinStart + 1, Math.round(200 / binHz));
      snareBinStart = kickBinEnd;
      snareBinEnd = Math.max(snareBinStart + 1, Math.round(600 / binHz));
      hatBinStart = Math.max(snareBinEnd, Math.round(2500 / binHz));
      hatBinEnd = Math.max(hatBinStart + 1, Math.round(7000 / binHz));

      audioSource.connect(analyser);
      audioSource.connect(beatAnalyser);
      analyser.connect(audioContext.destination);
      return true;
    } catch (err) {
      console.warn('Audio reactivity could not start:', err);
      return false;
    }
  }

  function readAudioEnergy(nowMs) {
    // Belt-and-suspenders: if reactivity is flagged on but the analyser
    // never got built (e.g. restored from a saved session), build it now
    // instead of silently doing nothing.
    if (audioReactive && !analyser) ensureAudioAnalysis();
    if (!audioReactive || !analyser || audioEl.paused) {
      audioLevels.bass *= 0.84;
      audioLevels.mid *= 0.84;
      audioLevels.high *= 0.84;
      kickTracker.pulse *= 0.84;
      snareTracker.pulse *= 0.84;
      hatTracker.pulse *= 0.84;
      audioLevels.kick = kickTracker.pulse;
      audioLevels.snare = snareTracker.pulse;
      audioLevels.hat = hatTracker.pulse;
      lastBeatCheckMs = null; // resync cleanly instead of one huge dtMs on resume
      return audioLevels;
    }

    analyser.getByteFrequencyData(frequencyData);
    const bins = frequencyData.length;
    const bass = averageFrequencyRange(0, Math.floor(bins * 0.12));
    const mid = averageFrequencyRange(Math.floor(bins * 0.12), Math.floor(bins * 0.45));
    const high = averageFrequencyRange(Math.floor(bins * 0.45), Math.floor(bins * 0.9));

    // Onset detection reads its own lightly-smoothed, narrow-band signals
    // (see detectBeat/bandEnergy) instead of the wide/heavily-smoothed
    // bands above — those are tuned for a slow glow pulse, not for
    // catching a sharp transient.
    detectBeat(nowMs);
    audioLevels.kick = kickTracker.pulse;
    audioLevels.snare = snareTracker.pulse;
    audioLevels.hat = hatTracker.pulse;

    // Fast attack and slower release keep the response lively while avoiding jitter.
    audioLevels.bass += (bass - audioLevels.bass) * (bass > audioLevels.bass ? 0.42 : 0.12);
    audioLevels.mid += (mid - audioLevels.mid) * (mid > audioLevels.mid ? 0.34 : 0.10);
    audioLevels.high += (high - audioLevels.high) * (high > audioLevels.high ? 0.28 : 0.09);
    return audioLevels;
  }

  function updateReactiveButton() {
    reactiveBtn.classList.toggle('active', audioReactive);
    reactiveBtn.textContent = '✦ React: ' + (audioReactive ? 'on' : 'off');
  }

  // Local file bytes go in IndexedDB (localStorage is too small for audio);
  // playlist metadata (names, URLs, which IndexedDB key a file lives under)
  // goes in localStorage since it's tiny and simple to read on load.
  let dbPromise = null;
  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open('nebulaAudioDB', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('tracks');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }
  async function saveBlob(id, blob) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('tracks', 'readwrite');
      tx.objectStore('tracks').put(blob, id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function loadBlob(id) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('tracks', 'readonly');
      const req = tx.objectStore('tracks').get(id);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }
  async function deleteBlob(id) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('tracks', 'readwrite');
      tx.objectStore('tracks').delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  function getPlaylist() {
    try { return JSON.parse(localStorage.getItem(PLAYLIST_KEY)) || []; }
    catch { return []; }
  }
  function savePlaylist(list) {
    localStorage.setItem(PLAYLIST_KEY, JSON.stringify(list));
  }

  function renderPlaylist() {
    const list = getPlaylist();
    playlistEl.innerHTML = '';
    list.forEach((item) => {
      const row = document.createElement('div');
      row.className = 'playlist-item' + (item.id === activeTrackId ? ' active' : '');
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = item.name;
      name.title = 'Load and play';
      name.addEventListener('click', () => playFromPlaylist(item));
      const del = document.createElement('button');
      del.textContent = '✕';
      del.title = 'Remove from playlist';
      del.addEventListener('click', async (e) => {
        e.stopPropagation();
        const remaining = getPlaylist().filter(x => x.id !== item.id);
        savePlaylist(remaining);
        if (item.kind === 'file') await deleteBlob(item.id);
        if (item.id === activeTrackId) { audioEl.pause(); audioEl.removeAttribute('src'); playBtn.disabled = true; reactiveBtn.disabled = true; audioReactive = false; updateReactiveButton(); playBtn.textContent = '▶ Play'; soundStatus.textContent = 'no track loaded'; activeTrackId = null; }
        renderPlaylist();
      });
      row.appendChild(name);
      row.appendChild(del);
      playlistEl.appendChild(row);
    });
  }

  async function playFromPlaylist(item) {
    if (item.kind === 'file') {
      const blob = await loadBlob(item.id);
      if (!blob) { soundStatus.textContent = 'that file is missing — re-add it'; return; }
      setTrack(URL.createObjectURL(blob), item.name, item.id, true);
    } else {
      setTrack(item.url, item.name, item.id, true);
    }
  }

  function setTrack(src, label, id, autoplay) {
    if (currentObjectUrl) { URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null; }
    if (src.startsWith('blob:')) currentObjectUrl = src;
    audioEl.src = src;
    soundStatus.textContent = label;
    playBtn.disabled = false;
    reactiveBtn.disabled = false;
    updateReactiveButton();
    playBtn.textContent = '▶ Play';
    activeTrackId = id || null;
    renderPlaylist();
    if (autoplay) {
      audioEl.play().then(() => { playBtn.textContent = '⏸ Pause'; }).catch(() => {});
    }
  }

  loadFileBtn.addEventListener('click', () => audioFileInput.click());
  audioFileInput.addEventListener('change', async () => {
    const file = audioFileInput.files[0];
    if (!file) return;
    const id = 'f_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    await saveBlob(id, file);
    const list = getPlaylist();
    list.push({ id, name: file.name, kind: 'file' });
    savePlaylist(list);
    setTrack(URL.createObjectURL(file), file.name, id, false);
  });

  loadUrlBtn.addEventListener('click', () => {
    let url = trackUrlInput.value.trim();
    if (!url) return;
    // github.com/.../blob/... links return an HTML page, not audio —
    // rewrite them to the raw.githubusercontent.com equivalent automatically
    const blobMatch = url.match(/^https?:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/(.+)$/);
    if (blobMatch) {
      url = `https://raw.githubusercontent.com/${blobMatch[1]}/${blobMatch[2]}/${blobMatch[3]}`;
    }
    const name = decodeURIComponent(url.split('/').pop());
    const id = 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    const list = getPlaylist();
    if (!list.some(x => x.kind === 'url' && x.url === url)) {
      list.push({ id, name, kind: 'url', url });
      savePlaylist(list);
    }
    setTrack(url, name, id, false);
  });

  playBtn.addEventListener('click', () => {
    if (audioEl.paused) {
      audioEl.play().catch(() => { soundStatus.textContent = 'couldn\'t play — check the source'; });
      // A context built during a restore (not a click) can start suspended;
      // this click is a real user gesture, so use it to wake it back up.
      if (audioContext && audioContext.state === 'suspended') audioContext.resume().catch(() => {});
      playBtn.textContent = '⏸ Pause';
    } else {
      audioEl.pause();
      playBtn.textContent = '▶ Play';
    }
  });

  reactiveBtn.addEventListener('click', () => {
    if (!audioEl.src) return;
    if (!ensureAudioAnalysis()) {
      soundStatus.textContent = 'audio reactivity is unavailable in this browser';
      return;
    }
    audioContext.resume().then(() => {
      audioReactive = !audioReactive;
      updateReactiveButton();
      saveSettings();
    }).catch(() => {
      soundStatus.textContent = 'tap React again after playback begins';
    });
  });

  renderPlaylist();

  // Ship with "Living Dreams" pre-loaded into the playlist itself (not just
  // sitting in the URL box) — added once, so it won't reappear if removed.
  (function seedDefaultTrack() {
    const SEEDED_KEY = 'nebulaSeededDefault';
    if (localStorage.getItem(SEEDED_KEY)) return;
    localStorage.setItem(SEEDED_KEY, '1');
    const url = 'https://raw.githubusercontent.com/MyMan577/Game-audio/main/Living%20Dreams.mp3';
    const list = getPlaylist();
    if (!list.some(x => x.kind === 'url' && x.url === url)) {
      list.push({ id: 'u_default_living_dreams', name: 'Living Dreams.mp3', kind: 'url', url });
      savePlaylist(list);
      renderPlaylist();
    }
  })();

  volumeSlider.addEventListener('input', () => {
    const v = +volumeSlider.value;
    audioEl.volume = v / 100;
    volumeVal.textContent = v;
    saveSettings();
  });

  restoreSettings();

  // ---------- Dock hide / show ----------
  const dock = document.getElementById('dock');
  const dockHandle = document.getElementById('dockHandle');
  const showDockBtn = document.getElementById('showDockBtn');

  function hideDock() {
    dock.classList.add('hidden');
    showDockBtn.classList.add('visible');
  }
  function revealDock() {
    dock.classList.remove('hidden');
    showDockBtn.classList.remove('visible');
  }
  dockHandle.addEventListener('click', hideDock);
  showDockBtn.addEventListener('click', revealDock);

  // seed the field immediately so particles are visible before any touch
  for (let i = 0; i < targetCount; i++) particles.push(makeParticle());

  // init background
  ctx.fillStyle = PALETTES[paletteKey].bg;
  ctx.fillRect(0, 0, W, H);
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
